# A real LiteLLM proxy with the callback, a mock provider and a mock of Meteroid's ingest that
# refuses the first two batches: `python3 run_e2e.py` checks a batch sent three times bills once,
# that an exhausted wallet is refused, and that calls proceed while Meteroid is down.
services:
  provider:
    image: ghcr.io/berriai/litellm:main-stable@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46
    entrypoint: ["python", "/e2e/mock_provider.py"]
    volumes: ["./:/e2e:ro"]

  meteroid:
    image: ghcr.io/berriai/litellm:main-stable@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46
    entrypoint: ["python", "/e2e/mock_meteroid.py"]
    environment:
      FAIL_FIRST: "2"
    volumes: ["./:/e2e:ro"]
    ports: ["18080:8080"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46
    command: ["--config", "/e2e/config.yaml", "--port", "4000"]
    environment:
      PYTHONPATH: /callback/src
      LITELLM_MASTER_KEY: sk-e2e
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      METEROID_API_KEY: pv_sand_e2e
      METEROID_API_BASE: http://meteroid:8080
      METEROID_FLUSH_INTERVAL: "1"
      METEROID_CUSTOMER_ID_FROM: end_user
      METEROID_CREDIT_GATE: "on"
      METEROID_CREDIT_GATE_CURRENCY: EUR
      METEROID_CREDIT_GATE_TIMEOUT: "1"
    volumes:
      - "./:/e2e:ro"
      - "../../:/callback:ro"
    ports: ["14000:4000"]
    depends_on: [provider, meteroid]
