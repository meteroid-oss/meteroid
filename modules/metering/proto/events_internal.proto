syntax = "proto3";

package meteroid.metering.v1;

import "google/protobuf/timestamp.proto";
import "models.proto";

message InternalIngestRequest {
  string tenant_id = 1;
  repeated Event events = 2;
  // allow ingesting events with a timestamp in the past (with a larger diff than the grace period)
  bool allow_backfilling = 3;
  // If true, fail the entire batch if any event fails validation
  bool fail_on_error = 4;
  // the tenant keeps the last copy of a re-sent event id instead of the first
  bool keep_last_events = 5;
}

message InternalIngestResponse {
  repeated IngestFailure failures = 1;
}

// Amends or voids the live copies of one event (ADR-0012). Queued on Kafka, keyed like the event,
// so it applies in order with the event's other copies.
message EnqueueEventChangeRequest {
  string tenant_id = 1;
  string customer_id = 2;
  string event_id = 3;
  EventChangeKind kind = 4;
  // AMEND only: the new rfc3339 timestamp and properties. The code and the customer cannot change.
  string timestamp = 5;
  map<string, string> properties = 6;
  // allow a new timestamp in the past (with a larger diff than the grace period)
  bool allow_backfilling = 7;
  // the tenant's keep_last_events: such tenants correct an event by re-sending it, so this is refused
  bool keep_last_events = 8;
  // the ingested_at of the amend's new row, after every live copy the caller saw; defaults to now
  google.protobuf.Timestamp ingested_at = 9;

  enum EventChangeKind {
    EVENT_CHANGE_KIND_UNSPECIFIED = 0;
    EVENT_CHANGE_KIND_AMEND = 1;
    EVENT_CHANGE_KIND_VOID = 2;
  }
}

message EnqueueEventChangeResponse {}

service InternalEventsService {
  rpc IngestInternal(InternalIngestRequest) returns (InternalIngestResponse);
  rpc EnqueueEventChange(EnqueueEventChangeRequest) returns (EnqueueEventChangeResponse);
}
