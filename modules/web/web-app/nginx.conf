# Choose the frame-ancestors policy from the *original* request URI. The SPA
# serves every route from /index.html via try_files, so the served location is
# always `/` — we key on $request_uri (unaffected by internal redirects) so the
# customer portal (embedded cross-origin via /embed.js, access gated by the
# portal token) is framable anywhere, while the admin app stays locked down.
map $request_uri $portal_frame_ancestors {
    default      "frame-ancestors *.localhost";
    ~*^/portal/  "frame-ancestors *";
}

server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Hashed assets (immutable, cache forever)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts (static, cache for 1 year)
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Customer-portal embed loader (cross-origin <script src> from tenant sites)
    location = /embed.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type application/javascript;
        try_files $uri =404;
    }

    # HTML and other non-hashed files (never cache). The frame-ancestors policy
    # is resolved per original request URI via the $portal_frame_ancestors map
    # above so the customer portal is embeddable while the admin app is not.
    location / {
        add_header Content-Security-Policy $portal_frame_ancestors always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    include /etc/nginx/extra-conf.d/*.conf;
}
