packages:
  - 'packages/*'
  - 'web-app'
engineStrict: true
nodeLinker: hoisted
publicHoistPattern:
  - '*prisma*'
  - '*eslint*'
  - '*storybook*'
strictPeerDependencies: false
overrides:
  'lodash@<4.18.1': '4.18.1'
  'd3-color@<3.1.0': '3.1.0'
  'cross-spawn@<7.0.6': '7.0.6'
  'ajv@>=6.0.0 <6.12.6': '6.12.6'
  'postcss@<8.5.23': '8.5.33'
  'postcss-selector-parser@<6.1.5': '6.1.6'
  'minimatch@>=3.0.0 <3.1.4': '3.1.4'
  'minimatch@>=9.0.0 <9.0.7': '9.0.7'
  'glob@>=10.0.0 <10.5.0': '10.5.0'
  'glob@>=13.0.0 <14.0.2': '14.0.2'
  'brace-expansion@<1.1.21': '1.1.22'
  'brace-expansion@>=2.0.0 <2.1.7': '2.1.8'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.13'
  'fast-uri@>=3.0.0 <3.1.9': '3.1.9'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'svgo@>=3.0.0 <3.3.5': '3.3.5'
  'tar@>=7.0.0 <7.5.11': '7.5.11'
  'uuid@>=11.0.0 <11.1.1': '11.1.1'
  'esbuild@<0.28.1': '0.28.1'
allowBuilds:
  '@bufbuild/buf': true
  '@md/icons': true
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
