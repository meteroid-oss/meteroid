[package]
name = "meteroid"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
meteroid-grpc-mapping.workspace = true
meteroid-rest-common.workspace = true
meteroid-app.workspace = true
meteroid-api.workspace = true
meteroid-kit.workspace = true
meteroid-rest.workspace = true
meteroid-workers.workspace = true
error-stack.workspace = true
base62 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
common-config = { workspace = true }
license-protocol.workspace = true
common-grpc = { workspace = true, features = ["server"] }
distributed-lock = { workspace = true }
egress-http = { workspace = true }
rate-limiter = { workspace = true, features = ["tonic", "axum"] }
meteroid-grpc = { path = "crates/meteroid-grpc", features = ["server"] }
diesel = { workspace = true, features = ["postgres"] }
diesel-async = { workspace = true, features = ["postgres", "migrations"] }
scoped-futures.workspace = true
diesel_migrations = { workspace = true, features = ["postgres"] }
envconfig.workspace = true
futures.workspace = true
log.workspace = true
prost-types.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tonic.workspace = true
axum-tracing-opentelemetry.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
base64.workspace = true
http = { workspace = true }

secrecy.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["default", "macros", "http2"] }

rust_decimal = { workspace = true, features = ["serde_json", "serde-with-float", "serde-with-str"] }
rust_decimal_macros = { workspace = true }

metering-grpc = { workspace = true }
meteroid-oauth = { workspace = true }
common-domain = { workspace = true, features = ["utoipa", "tonic"] }
common-eventbus = { workspace = true }
bytes.workspace = true
async-trait.workspace = true
image = { workspace = true }
meteroid-store.workspace = true
meteroid-invoicing.workspace = true
meteroid-mailer.workspace = true
lazy-regex.workspace = true
meteroid-seeder = { workspace = true }
hex.workspace = true
hmac-sha256.workspace = true

utoipa-axum.workspace = true
utoipa-scalar.workspace = true
itertools = { workspace = true }
metering = { workspace = true, features = ["clickhouse", "kafka"], optional = true }
metering-server = { workspace = true, optional = true }
common-grpc-error-as-tonic-macros = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
meteroid-app = { workspace = true }
http-client-tracing = { workspace = true }
meteroid-testkit.workspace = true
rstest = { workspace = true }
tokio-postgres.workspace = true
testcontainers = { workspace = true }
metering = { workspace = true, features = ["clickhouse", "kafka"] }
clickhouse = { workspace = true, features = ["uuid"] }
serde = { workspace = true }
metering-server = { workspace = true }
backon = { workspace = true }
diesel-models.workspace = true
meteroid-mailer = { workspace = true }
meteroid-store = { workspace = true }
insta = { workspace = true, features = ["json"] }

[build-dependencies]
utoipa-config.workspace = true

[package.metadata.cargo-machete]
# companion crate for ErrorAsTonic — its functions are called by generated code, not direct imports
ignored = ["common-grpc-error-as-tonic-macros"]

[features]
# Embeds the metering server in the all-in-one standalone build (development and preview).
# Shipped binaries never enable this.
metering-server = ["dep:metering", "dep:metering-server"]

[package.metadata.cargo-shear]
ignored = ["common-grpc-error-as-tonic-macros"]
