[package]
name = "meteroid-app"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
http-client-tracing = { workspace = true }
meteroid-rest-common.workspace = true
error-stack.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["clock"] }
common-config = { workspace = true }
license-protocol.workspace = true
common-logging = { workspace = true }
common-grpc = { workspace = true, features = ["server"] }
croner = { workspace = true }
distributed-lock = { workspace = true }
egress-http = { workspace = true }
rate-limiter = { workspace = true, features = ["tonic", "axum"] }
meteroid-grpc = { path = "../meteroid-grpc", features = ["server"] }
diesel = { workspace = true, features = ["postgres"] }
diesel-async = { workspace = true, features = ["postgres", "migrations"] }
scoped-futures.workspace = true
diesel_migrations = { workspace = true, features = ["postgres"] }
envconfig.workspace = true
futures.workspace = true
log.workspace = true
prost-types.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tonic.workspace = true
tower-http.workspace = true
opentelemetry.workspace = true
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
base64.workspace = true
http = { workspace = true }
parquet = { workspace = true, features = ["snap", "arrow"] }

secrecy.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["default", "macros", "http2"] }
hyper = { workspace = true, features = ["http1", "http2", "server"] }

rust_decimal = { workspace = true, features = ["serde_json", "serde-with-float", "serde-with-str"] }

metering-grpc = { workspace = true }
meteroid-oauth = { workspace = true }
meteroid-tax = { workspace = true }
common-domain = { workspace = true, features = ["utoipa", "tonic"] }
common-eventbus = { workspace = true }
object_store = { workspace = true, features = ["aws", "azure", "gcp", "http", "fs"] }
bytes.workspace = true
async-trait.workspace = true
url.workspace = true
csv = "1.3"
encoding_rs.workspace = true
jsonwebtoken = { workspace = true }
image = { workspace = true }
meteroid-store.workspace = true
meteroid-invoicing.workspace = true
meteroid-mailer.workspace = true
rand.workspace = true
meteroid-money.workspace = true
sha2.workspace = true
hex.workspace = true
hmac-sha256.workspace = true


strum = { workspace = true, features = ["derive"] }
itertools = { workspace = true }
validator = { workspace = true, features = ["derive"] }
fred = { workspace = true }
common-grpc-error-as-tonic-macros = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../../crates/workspace-hack" }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }

[build-dependencies]
utoipa-config.workspace = true

[package.metadata.cargo-machete]
# companion crate for ErrorAsTonic — its functions are called by generated code, not direct imports
ignored = ["common-grpc-error-as-tonic-macros"]

[package.metadata.cargo-shear]
ignored = ["common-grpc-error-as-tonic-macros"]
