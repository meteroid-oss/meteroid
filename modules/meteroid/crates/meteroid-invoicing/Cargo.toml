[package]
name = "meteroid-invoicing"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = { workspace = true }
bytes.workspace = true
once_cell = { workspace = true }
en16931.workspace = true
en16931-formats.workspace = true
lopdf = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde", "unstable-locales", "alloc"] }
fluent-static.workspace = true
rust_decimal = { workspace = true }
meteroid-money = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json.workspace = true
typst = { workspace = true }
typst-pdf = { workspace = true }
typst-svg = { workspace = true }
typst-as-lib = { workspace = true }
tokio = { workspace = true, features = ["full"] }
common-domain.workspace = true
# Not used directly: pins typst's transitive versions (see the root Cargo.toml).
ecow.workspace = true
time.workspace = true
workspace-hack = { version = "0.1", path = "../../../../crates/workspace-hack" }

[dev-dependencies]
# The corpus sweeps every ISO country to prove no non-EU seller can reach EU wording.
rust_iso3166 = { workspace = true }
en16931.workspace = true
en16931-formats.workspace = true

[build-dependencies]
serde_json.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trybuild)'] }

[package.metadata.cargo-shear]
ignored = ["ecow", "time"]
