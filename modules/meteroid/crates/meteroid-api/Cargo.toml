meteroid-grpc = { path = "../meteroid-grpc", features = ["server"] }
meteroid-middleware = { path = "../meteroid-middleware", features = ["server"] }
futures.workspace = true
log.workspace = true
nanoid.workspace = true
prost-types.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tonic-health.workspace = true
tonic-reflection.workspace = true
tonic.workspace = true
tonic-web.workspace = true
tonic-tracing-opentelemetry.workspace = true
tower-http.workspace = true
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
base64.workspace = true
http = { workspace = true }

secrecy.workspace = true
anyhow.workspace = true

rust_decimal = { workspace = true, features = ["serde_json", "serde-with-float", "serde-with-str"] }
