[package]
name = "diesel-models"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { workspace = true, features = [ "serde"] }
diesel = { workspace = true, features = ["64-column-tables", "chrono"] }
diesel-schema.workspace = true
diesel-async.workspace = true
uuid = { workspace = true, features = ["serde", "v5"] }
serde_json.workspace = true
error-stack.workspace = true
thiserror.workspace = true
log.workspace = true
rust_decimal = { workspace = true, features = ["db-diesel2-postgres", "serde_json"] }
tap.workspace = true
itertools.workspace = true
common-domain = { workspace = true, features = ["diesel"] }
diesel-derive-newtype.workspace = true
serde = { workspace = true, features = ["derive"] }
workspace-hack = { version = "0.1", path = "../../../../crates/workspace-hack" }

[features]
debug-sql = []

[package.metadata.cargo-machete]
# used via #[derive(DieselNewType)] and #[derive(Serialize, Deserialize)] — machete misses derive macro usage
ignored = ["diesel-derive-newtype", "serde"]

[package.metadata.cargo-shear]
ignored = ["diesel-derive-newtype", "serde"]
