[package]
name = "meteroid-middleware"
version = "0.1.0"
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
common-grpc = { workspace = true, features = ["server"], optional = true }
common-domain = { workspace = true, optional = true }
meteroid-store = { workspace = true, optional = true }

cached = { workspace = true, features = ["async", "tokio"], optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
http = { workspace = true }
tonic = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-layer = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
tracing = { workspace = true }
futures-util = { workspace = true, optional = true }

uuid = { workspace = true, features = ["serde"], optional = true }
jsonwebtoken = { workspace = true, optional = true }
chrono = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }

governor = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
reqwest-middleware = { workspace = true, features = ["json"], optional = true }
futures = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../../../../crates/workspace-hack" }


[dev-dependencies]
# used by the RBAC route-classification exhaustiveness test (server feature)
meteroid-grpc = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

[features]
server = [
  "dep:common-grpc",
  "dep:common-domain",
  "dep:meteroid-store",
    "dep:cached",
  "dep:tokio",
  "dep:tonic",
  "dep:tower",
  "dep:tower-layer",
  "dep:hyper",
  "dep:futures",
  "dep:futures-util",
  "dep:uuid",
  "dep:jsonwebtoken",
]
client = [
  "dep:reqwest",
  "dep:reqwest-middleware",
  "dep:governor",
]
default = []

[package.metadata.cargo-machete]
# futures is gated behind the `server` feature via dep: syntax — machete doesn't evaluate feature flags
ignored = ["futures"]

[package.metadata.cargo-shear]
ignored = ["futures"]
