[package]
name = "meteroid-workers"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
meteroid-rest-common.workspace = true
meteroid-kit.workspace = true
meteroid-rest.workspace = true
meteroid-app.workspace = true
error-stack.workspace = true
cached = { workspace = true, features = ["async", "tokio"] }
chrono = { workspace = true, features = ["clock"] }
common-logging = { workspace = true }
distributed-lock = { workspace = true }
egress-http = { workspace = true }
futures.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
opentelemetry.workspace = true
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
http = { workspace = true }

secrecy.workspace = true
axum = { workspace = true, features = ["default", "macros", "http2"] }

rust_decimal = { workspace = true, features = ["serde_json", "serde-with-float", "serde-with-str"] }

metering-grpc = { workspace = true }
meteroid-oauth = { workspace = true }
meteroid-tax = { workspace = true }
common-domain = { workspace = true, features = ["utoipa", "tonic"] }
common-eventbus = { workspace = true }
common-utils = { workspace = true, features = ["error-stack-conv"] }
bytes.workspace = true
async-trait.workspace = true
csv = "1.3"
meteroid-store.workspace = true
meteroid-invoicing.workspace = true
meteroid-mailer.workspace = true
rand.workspace = true
meteroid-money.workspace = true
hubspot-client = { workspace = true }
pennylane-client = { workspace = true }
moka = { workspace = true, features = ["future"] }


strum = { workspace = true, features = ["derive"] }
itertools = { workspace = true }
common-grpc-error-as-tonic-macros = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../../crates/workspace-hack" }

[dev-dependencies]
meteroid-app = { workspace = true }

[package.metadata.cargo-machete]
# companion crate for ErrorAsTonic — its functions are called by generated code, not direct imports
ignored = ["common-grpc-error-as-tonic-macros"]

[package.metadata.cargo-shear]
ignored = ["common-grpc-error-as-tonic-macros"]
