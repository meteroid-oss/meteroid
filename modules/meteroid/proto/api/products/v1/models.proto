syntax = "proto3";

package meteroid.api.products.v1;

import "api/prices/v1/models.proto";

message Product {
  string id = 1;
  string name = 2;
  optional string description = 3;
  string created_at = 4;
  string local_id = 5;
  optional meteroid.api.prices.v1.FeeType fee_type = 6;
  optional meteroid.api.prices.v1.FeeStructure fee_structure = 7;
  bool catalog = 8;
  optional string tax_category_id = 9;
  optional string archived_at = 10;
  // A lucide icon name and a color token; unset draws the default box, neutral.
  optional string icon = 11;
  optional string color = 12;
}

message ProductMeta {
  string id = 1;
  string name = 2;
  string local_id = 3;
  optional meteroid.api.prices.v1.FeeType fee_type = 4;
  optional string description = 5;
  string created_at = 6;
  bool catalog = 7;
  optional string archived_at = 8;
  optional string icon = 9;
  optional string color = 10;
  // Filled by SearchProducts, for the catalog list: the latest price in each currency, the
  // features it grants, the live plans that sell it, and what it reads.
  repeated meteroid.api.prices.v1.Price latest_prices = 11;
  uint32 feature_count = 12;
  uint32 plan_count = 13;
  optional string metric_name = 14;
  optional meteroid.api.prices.v1.FeeStructure fee_structure = 15;
}

message ProductWithPrice {
  Product product = 1;
  optional meteroid.api.prices.v1.Price latest_price = 2;
}
