syntax = "proto3";

package meteroid.api.addons.v1;

import "api/prices/v1/models.proto";

message AddOn {
  string id = 1;
  string name = 2;
  optional string description = 3;
  reserved 4;
  string price_id = 5;
  string product_id = 6;
  // How the add-on bills its product (its own, never its product's).
  meteroid.api.prices.v1.FeeType fee_type = 7;
  meteroid.api.prices.v1.Price price = 8;
  bool self_serviceable = 9;
  optional int32 max_instances_per_subscription = 10;
  optional string archived_at = 11;
  optional meteroid.api.prices.v1.FeeStructure fee_structure = 12;
  string created_at = 13;
  // Every price of the add-on, one per currency and billing period; `price` is the first, kept
  // for older clients. A subscription is offered the add-on in its own currency only.
  repeated meteroid.api.prices.v1.Price prices = 14;
  // Its product's icon and color.
  optional string product_icon = 15;
  optional string product_color = 16;
}

message PlanVersionAddOn {
  string id = 1;
  string plan_version_id = 2;
  string add_on_id = 3;
  optional string price_id = 4;
  optional bool self_serviceable = 5;
  optional int32 max_instances_per_subscription = 6;
}
