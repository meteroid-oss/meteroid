syntax = "proto3";

package meteroid.api.quantities.v1;

import "api/quantities/v1/models.proto";

// The tenant's managed quantities. A seat charge names the one it counts.
service ManagedQuantitiesService {
  rpc ListManagedQuantities(ListManagedQuantitiesRequest) returns (ListManagedQuantitiesResponse) {}
  rpc CreateManagedQuantity(CreateManagedQuantityRequest) returns (CreateManagedQuantityResponse) {}
  rpc UpdateManagedQuantity(UpdateManagedQuantityRequest) returns (UpdateManagedQuantityResponse) {}
  rpc SetFeatureLimitQuantity(SetFeatureLimitQuantityRequest) returns (SetFeatureLimitQuantityResponse) {}
}

message ListManagedQuantitiesRequest {}
message ListManagedQuantitiesResponse {
  repeated ManagedQuantity quantities = 1;
}

// A new quantity; refused when the tenant has one of `code` already.
message CreateManagedQuantityRequest {
  // Immutable: lowercase letters, digits, `_` and `-`.
  string code = 1;
  string name = 2;
  optional QuantityIncrease on_increase = 3;
  optional QuantityDecrease on_decrease = 4;
}
message CreateManagedQuantityResponse {
  ManagedQuantity quantity = 1;
}

// Each optional field left unset leaves that property unchanged.
message UpdateManagedQuantityRequest {
  string id = 1;
  optional string name = 2;
  optional QuantityIncrease on_increase = 3;
  optional QuantityDecrease on_decrease = 4;
}
message UpdateManagedQuantityResponse {
  ManagedQuantity quantity = 1;
}

// A metered feature's limit, counted per unit of the quantity a subscription holds
// (10k API calls per seat); unset counts it per subscription again.
message SetFeatureLimitQuantityRequest {
  string feature_id = 1;
  optional string managed_quantity_id = 2;
}
message SetFeatureLimitQuantityResponse {}
