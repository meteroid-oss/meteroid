syntax = "proto3";

package meteroid.api.billablemetrics.v1;

import "api/billablemetrics/v1/models.proto";
import "common/v1/pagination.proto";

message CreateBillableMetricRequest {
  string name = 1;
  string code = 2;
  optional string description = 3;
  Aggregation aggregation = 4;
  SegmentationMatrix segmentation_matrix = 5;
  optional string usage_group_key = 6;
  string family_local_id = 7;
  optional string product_id = 8;
  repeated MetricFilter filters = 9;
  // Both labels or neither; blank labels mean none.
  MetricUnitLabel unit_label = 10;
}

message CreateBillableMetricResponse {
  BillableMetric billable_metric = 1;
}

message ListBillableMetricsRequest {
  optional string family_local_id = 1;
  meteroid.common.v1.Pagination pagination = 2;
  optional bool archived = 3;
  optional string order_by = 4;
  optional string search = 5;
}

message ListBillableMetricsResponse {
  repeated BillableMetricMeta billable_metrics = 1;
  meteroid.common.v1.PaginationResponse pagination_meta = 2;
}

message GetBillableMetricRequest {
  string id = 1;
}

message GetBillableMetricResponse {
  BillableMetric billable_metric = 1;
}

message ArchiveBillableMetricRequest {
  string id = 1;
}

message ArchiveBillableMetricResponse {
}

message UnarchiveBillableMetricRequest {
  string id = 1;
}

message UnarchiveBillableMetricResponse {
}

message UpdateBillableMetricRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional Aggregation.UnitConversion unit_conversion = 4;
  optional SegmentationMatrixValuesUpdate segmentation_matrix_values = 5;
  // Absent = leave filters untouched; present (even empty) = replace the metric's filters.
  optional MetricFilterList filters = 6;
  // Absent = leave the label untouched; both labels blank = remove it.
  optional MetricUnitLabel unit_label = 7;
}

message UpdateBillableMetricResponse {
  BillableMetric billable_metric = 1;
}

// Window size for a usage time series.
enum UsageGrain {
  USAGE_GRAIN_UNSPECIFIED = 0;
  USAGE_GRAIN_HOUR = 1;
  USAGE_GRAIN_DAY = 2;
}

message GetBillableMetricUsageRequest {
  string id = 1;
  // ISO-8601 date (yyyy-mm-dd), inclusive lower bound. Defaults to 30 grains ago.
  optional string from = 2;
  // ISO-8601 date (yyyy-mm-dd), exclusive upper bound. Defaults to now.
  optional string to = 3;
  UsageGrain grain = 4;
}

// One point of a usage time series. Mirrors analytics.v1 ExplorePoint.
message UsageDataPoint {
  // ISO-8601 datetime of the window bounds.
  string window_start = 1;
  string window_end = 2;
  double value = 3;
}

message GetBillableMetricUsageResponse {
  repeated UsageDataPoint data = 1;
}

service BillableMetricsService {
  rpc CreateBillableMetric (CreateBillableMetricRequest) returns (CreateBillableMetricResponse) {}
  rpc ListBillableMetrics (ListBillableMetricsRequest) returns (ListBillableMetricsResponse) {}
  rpc GetBillableMetric (GetBillableMetricRequest) returns (GetBillableMetricResponse) {}
  rpc UpdateBillableMetric (UpdateBillableMetricRequest) returns (UpdateBillableMetricResponse) {}
  rpc ArchiveBillableMetric (ArchiveBillableMetricRequest) returns (ArchiveBillableMetricResponse) {}
  rpc UnarchiveBillableMetric (UnarchiveBillableMetricRequest) returns (UnarchiveBillableMetricResponse) {}

  // Tenant-scoped usage time series for one billable metric, aggregated across
  // all customers. Loads the metric (tenant-scoped), builds a QueryMeter over the
  // raw events for its `code`/`aggregation_type`/`aggregation_key`, windowed by
  // `grain`. Tenant scope comes from the authenticated request, never the body.
  rpc GetBillableMetricUsage (GetBillableMetricUsageRequest) returns (GetBillableMetricUsageResponse) {}
}
