syntax = "proto3";

package meteroid.api.coupons.v1;

import "api/eligibility/v1/models.proto";

import "api/coupons/v1/models.proto";
import "common/v1/pagination.proto";


message ListCouponRequest {
  optional string search = 1;
  CouponFilter filter = 2;
  meteroid.common.v1.Pagination pagination = 3;
  optional string order_by = 4;
  // Only the coupons scoped to this plan by name; unset: every coupon.
  optional string plan_id = 5;

  enum CouponFilter {
    ALL = 0;
    ACTIVE = 1;
    INACTIVE = 2;
    ARCHIVED = 3;
  }
}


message ListCouponResponse {
  repeated Coupon coupons = 1;
  meteroid.common.v1.PaginationResponse pagination_meta = 2;
}


message CreateCouponRequest {
  string code = 1;
  string description = 2;
  CouponDiscount discount = 3;
  optional string expires_at = 4;
  optional int32 redemption_limit = 5;
  optional int32 recurring_value = 6;
  bool reusable = 7;
  repeated string plan_ids = 8;
  repeated string add_on_ids = 9;
  optional meteroid.api.eligibility.v1.Eligibility eligibility = 10;
  optional string valid_from = 11;
  // Billing periods starting within this many months of the first paid period, instead of
  // recurring_value (kept for compatibility).
  optional int32 duration_months = 12;
}

message CreateCouponResponse {
  Coupon coupon = 1;
}

message RemoveCouponRequest {
  string coupon_id = 1;
}

message RemoveCouponResponse {}

message EditCouponRequest {
  string coupon_id = 1;
  string description = 2;
  CouponDiscount discount = 3;
  repeated string plan_ids = 4;
  repeated string add_on_ids = 5;
  // Unset leaves the rule as it is; an empty rule removes it.
  optional meteroid.api.eligibility.v1.Eligibility eligibility = 6;
  optional string valid_from = 7;
  optional string expires_at = 8;
  // Billing periods starting within this many months of the first paid period. Unset leaves it
  // as it is. Existing redemptions keep theirs.
  optional int32 duration_months = 9;
  // Makes it last forever instead of a number of months; not with duration_months.
  bool clear_duration_months = 10;
}

message EditCouponResponse {
  Coupon coupon = 1;
}


enum CouponAction {
  ARCHIVE = 0;
  DISABLE = 1;
  ENABLE = 2;
}

message UpdateCouponStatusRequest {
  string coupon_id = 1;
  CouponAction action = 2;
}

message UpdateCouponStatusResponse {
  Coupon coupon = 1;
}

message ListAppliedCouponRequest {
  string coupon_local_id = 1;
  meteroid.common.v1.Pagination pagination = 2;
}

message ListAppliedCouponResponse {
  repeated AppliedCouponForDisplay applied_coupons = 1;
  meteroid.common.v1.PaginationResponse pagination_meta = 2;
}

message GetCouponRequest {
  string coupon_local_id = 1;
}

message GetCouponResponse {
  Coupon coupon = 1;
}

service CouponsService {
  rpc GetCoupon(GetCouponRequest) returns (GetCouponResponse) {}
  rpc ListCoupons(ListCouponRequest) returns (ListCouponResponse) {}
  rpc ListAppliedCoupons(ListAppliedCouponRequest) returns (ListAppliedCouponResponse) {}
  rpc CreateCoupon(CreateCouponRequest) returns (CreateCouponResponse) {}
  rpc RemoveCoupon(RemoveCouponRequest) returns (RemoveCouponResponse) {}
  rpc EditCoupon(EditCouponRequest) returns (EditCouponResponse) {}
  rpc UpdateCouponStatus(UpdateCouponStatusRequest) returns (UpdateCouponStatusResponse) {}
}
