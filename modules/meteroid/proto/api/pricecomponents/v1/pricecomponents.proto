syntax = "proto3";

package meteroid.api.components.v1;

import "api/billablemetrics/v1/models.proto";
import "api/pricecomponents/v1/models.proto";
import "api/products/v1/models.proto";

message EditPriceComponentRequest {
  string plan_version_id = 1;
  PriceComponent component = 2;
  repeated PriceEntry prices = 4;
}

message EditPriceComponentResponse {
  PriceComponent component = 1;
}

message CreatePriceComponentRequest {
  string plan_version_id = 1;
  string name = 2;
  reserved 3, 4, 5, 6;
  ProductRef product = 7;
  repeated PriceEntry prices = 8;
}

message CreatePriceComponentResponse {
  PriceComponent component = 1;
}

message RemovePriceComponentRequest {
  string price_component_id = 1;
}

message ListPriceComponentRequest {
  string plan_version_id = 1;
}

message ListPriceComponentResponse {
  repeated PriceComponent components = 1;
  // The products the components reference, and the metrics those products bill on,
  // so a plan renders without a lookup per component.
  repeated meteroid.api.products.v1.Product products = 2;
  repeated meteroid.api.billablemetrics.v1.BillableMetric metrics = 3;
}

message EmptyResponse {
}

// One price of a charge, set in the cell (option, currency) of each listed option. Draft
// versions only. A cell's previous prices leave it (never edited in place: a published version
// may bill them).
message SetComponentPriceRequest {
  string price_component_id = 1;
  reserved 2;
  reserved "price_book_id";
  // Its currency names the cell; its cadence is how it bills.
  PriceInput price = 3;
  // Empty: every option of the version.
  repeated string option_ids = 4;
  // The whole cell instead of `price` (ignored when set): one price, or a capacity charge's
  // levels, one per commitment, in one currency and on one cadence. Every price the cell held
  // leaves it. With `price` alone, a capacity price replaces only the level of its commitment.
  repeated PriceInput prices = 5;
}
message SetComponentPriceResponse {
  PriceComponent component = 1;
}

// Empties the cell (option, currency) of each listed option: the charge has no price there.
message ClearComponentPriceRequest {
  string price_component_id = 1;
  reserved 2, 3;
  reserved "price_book_id", "cadence";
  string currency = 4;
  // Empty: every option of the version.
  repeated string option_ids = 5;
}
message ClearComponentPriceResponse {
  PriceComponent component = 1;
}

service PriceComponentsService {
  rpc ListPriceComponents(ListPriceComponentRequest) returns (ListPriceComponentResponse) {}
  rpc CreatePriceComponent(CreatePriceComponentRequest) returns (CreatePriceComponentResponse) {}
  rpc EditPriceComponent(EditPriceComponentRequest) returns (EditPriceComponentResponse) {}
  rpc RemovePriceComponent(RemovePriceComponentRequest) returns (EmptyResponse) {}
  rpc SetComponentPrice(SetComponentPriceRequest) returns (SetComponentPriceResponse) {}
  rpc ClearComponentPrice(ClearComponentPriceRequest) returns (ClearComponentPriceResponse) {}
}
