syntax = "proto3";

package meteroid.api.invoices.v1;

import "api/invoices/v1/models.proto";
import "common/v1/pagination.proto";
import "common/v1/filters.proto";

message ListInvoicesRequest {
  optional string order_by = 1;
  optional string search = 2;
  meteroid.common.v1.Pagination pagination = 3;
  optional InvoiceStatus status = 4;
  optional string customer_id = 5;
  optional string subscription_id = 6;
  optional InvoicePaymentStatus payment_status = 7;
  optional EInvoicingStatus einvoicing_status = 8;
  // Dynamic filters over custom properties (field `cp:<key>`); AND-combined.
  repeated meteroid.common.v1.Filter filters = 9;
  // Only invoices finalized, still owed and past their due date.
  optional bool overdue = 10;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  meteroid.common.v1.PaginationResponse pagination_meta = 2;
}

message GetInvoiceRequest {
  string id = 1;
}

message GetInvoiceResponse {
  DetailedInvoice invoice = 1;
}

message RefreshInvoiceDataRequest {
  string id = 1;
}

message RefreshInvoiceDataResponse {
  DetailedInvoice invoice = 1;
}

message PreviewInvoiceRequest {
  string id = 1;
}

message PreviewInvoiceResponse {
  repeated string svgs = 1;
}

message RequestPdfGenerationRequest {
  string id = 1;
}

message RequestPdfGenerationResponse {}

message CheckEinvoicingReadinessRequest {
  string id = 1;
}

message CheckEinvoicingReadinessResponse {
  // Absent when there is nothing to check: the invoicing entity has not opted
  // into e-invoicing, or the invoice is a consolidated child, which is never
  // issued on its own.
  optional EInvoicingReadiness readiness = 1;
}

message SyncToPennylaneRequest {
  repeated string invoice_ids = 1;
}

message SyncToPennylaneResponse {
}

message CreateInvoiceRequest {
  NewInvoice invoice = 1;
}

message CreateInvoiceResponse {
  DetailedInvoice invoice = 1;
}

message CreateCorrectedInvoiceRequest {
  string parent_invoice_id = 1;
}

message CreateCorrectedInvoiceResponse {
  DetailedInvoice invoice = 1;
}

message PreviewNewInvoiceRequest {
  NewInvoice invoice = 1;
}

message PreviewNewInvoiceResponse {
  repeated string svgs = 1;
}

message FinalizeInvoiceRequest {
  string id = 1;
}

message FinalizeInvoiceResponse {
  DetailedInvoice invoice = 1;
}

message DeleteInvoiceRequest {
  string id = 1;
}

message DeleteInvoiceResponse {}

message VoidInvoiceRequest {
  string id = 1;
}

message VoidInvoiceResponse {
  DetailedInvoice invoice = 1;
}

// Bills again, recomputed on current data, the billing period of a voided recurring invoice.
message RegenerateInvoiceRequest {
  string id = 1;
}

message RegenerateInvoiceResponse {
  DetailedInvoice invoice = 1;
}

message MarkInvoiceAsUncollectibleRequest {
  string id = 1;
}

message MarkInvoiceAsUncollectibleResponse {
  DetailedInvoice invoice = 1;
}

message UpdateInvoiceResponse {
  DetailedInvoice invoice = 1;
}

message PreviewInvoiceUpdateRequest {
  UpdateInvoiceRequest update_request = 1;
}

message PreviewInvoiceUpdateResponse {
  DetailedInvoice preview = 1;
}

message GenerateInvoicePaymentTokenRequest {
  string invoice_id = 1;
}

message GenerateInvoicePaymentTokenResponse {
  string token = 1;
}

message AddManualPaymentTransactionRequest {
  string invoice_id = 1;
  string amount = 2;
  optional string payment_date = 3;
  optional string reference = 4;
}

message AddManualPaymentTransactionResponse {
  string transaction_id = 1;
  string invoice_id = 2;
  string amount = 3;
  string currency = 4;
  string status = 5;
  string payment_date = 6;
}

message MarkInvoiceAsPaidRequest {
  string invoice_id = 1;
  string total_amount = 2; // Must match invoice amount_due
  optional string payment_date = 3;
  optional string reference = 4;
}

message MarkInvoiceAsPaidResponse {
  DetailedInvoice invoice = 1;
}

// Issue a refund through the provider that took the parent payment. The refund is a child
// REFUND transaction; the invoice keeps its amount due and payment status, since the Refund
// credit note is what reduces it.
message RefundTransactionRequest {
  // The settled PAYMENT transaction to refund.
  string transaction_id = 1;
  // Decimal, major units, in the parent's currency.
  string amount = 2;
  // The finalized Refund credit note this draws on. Absent is only allowed for an overpayment.
  optional string credit_note_id = 3;
  optional string reason = 4;
}

message RefundTransactionResponse {
  Transaction transaction = 1;
}

// Record a refund that moved outside Meteroid (wire, cheque, cash). Allowed on any settled
// payment, provider-backed or manual.
message RecordOfflineRefundRequest {
  string transaction_id = 1;
  string amount = 2;
  optional string credit_note_id = 3;
  optional string refund_date = 4;
  // Wire or cheque reference, stored like a manual payment's.
  optional string reference = 5;
  optional string reason = 6;
}

message RecordOfflineRefundResponse {
  Transaction transaction = 1;
}

// Claw back a manually recorded payment. A chargeback, debtor recall or dispute keeps the invoice
// paid and books the loss; any other kind means the funds never landed, so the invoice reopens.
// Provider-backed payments are clawed back by the provider's own event instead.
message ReverseManualPaymentRequest {
  string transaction_id = 1;
  Transaction.ReversalKind kind = 2;
  optional string reason = 3;
  optional string reversed_at = 4;
}

message ReverseManualPaymentResponse {
  Transaction transaction = 1;
}

// Test gateway only: pushes the event a real provider would have sent for this transaction, so a
// pending test payment can be settled or failed, and a settled one refunded, from the backoffice.
message SimulateTestGatewayEventRequest {
  string transaction_id = 1;
  TestGatewayEvent event = 2;

  enum TestGatewayEvent {
    SUCCEEDED = 0;
    FAILED = 1;
    REFUNDED = 2;
    CHARGED_BACK = 3;
  }
}

message SimulateTestGatewayEventResponse {}

service InvoicesService {
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {}
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse) {}
  rpc PreviewInvoiceSvg(PreviewInvoiceRequest) returns (PreviewInvoiceResponse) {}
  rpc CheckEinvoicingReadiness(CheckEinvoicingReadinessRequest) returns (CheckEinvoicingReadinessResponse) {}
  rpc RequestPdfGeneration(RequestPdfGenerationRequest) returns (RequestPdfGenerationResponse) {}
  rpc RefreshInvoiceData(RefreshInvoiceDataRequest) returns (RefreshInvoiceDataResponse) {}
  rpc SyncToPennylane(SyncToPennylaneRequest) returns (SyncToPennylaneResponse) {}
  rpc GenerateInvoicePaymentToken(GenerateInvoicePaymentTokenRequest) returns (GenerateInvoicePaymentTokenResponse) {}
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse) {}
  rpc CreateCorrectedInvoice(CreateCorrectedInvoiceRequest) returns (CreateCorrectedInvoiceResponse) {}
  rpc PreviewNewInvoiceSvg(PreviewNewInvoiceRequest) returns (PreviewNewInvoiceResponse) {}
  rpc FinalizeInvoice(FinalizeInvoiceRequest) returns (FinalizeInvoiceResponse) {}
  rpc UpdateInvoice(UpdateInvoiceRequest) returns (UpdateInvoiceResponse) {}
  rpc PreviewInvoiceUpdate(PreviewInvoiceUpdateRequest) returns (PreviewInvoiceUpdateResponse) {}
  rpc DeleteInvoice(DeleteInvoiceRequest) returns (DeleteInvoiceResponse) {}
  rpc VoidInvoice(VoidInvoiceRequest) returns (VoidInvoiceResponse) {}
  rpc RegenerateInvoice(RegenerateInvoiceRequest) returns (RegenerateInvoiceResponse) {}
  rpc MarkInvoiceAsUncollectible(MarkInvoiceAsUncollectibleRequest) returns (MarkInvoiceAsUncollectibleResponse) {}
  rpc AddManualPaymentTransaction(AddManualPaymentTransactionRequest) returns (AddManualPaymentTransactionResponse) {}
  rpc MarkInvoiceAsPaid(MarkInvoiceAsPaidRequest) returns (MarkInvoiceAsPaidResponse) {}
  rpc RefundTransaction(RefundTransactionRequest) returns (RefundTransactionResponse) {}
  rpc RecordOfflineRefund(RecordOfflineRefundRequest) returns (RecordOfflineRefundResponse) {}
  rpc ReverseManualPayment(ReverseManualPaymentRequest) returns (ReverseManualPaymentResponse) {}
  rpc SimulateTestGatewayEvent(SimulateTestGatewayEventRequest) returns (SimulateTestGatewayEventResponse) {}
}
