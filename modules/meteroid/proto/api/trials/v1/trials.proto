syntax = "proto3";

package meteroid.api.trials.v1;

import "api/plans/v1/models.proto";
import "api/subscriptions/v1/models.proto";

// A trial in the catalog: a plan's trial, or given at a subscription's creation by name, once per
// customer and scope when its eligibility says so (R-153, R-159). Writes are Enterprise.
message TrialOffer {
  reserved 5, 6;
  reserved "end_action", "fallback_plan_version_id";
  string id = 1;
  string name = 2;
  // How the API names it beside its id, unique in the tenant.
  optional string code = 3;
  meteroid.api.plans.v1.TrialTerms terms = 4;
  meteroid.api.plans.v1.TrialEligibility eligibility = 7;
  bool archived = 8;
  // The plans it is the trial of; read only.
  repeated string plan_ids = 9;
}

message ListTrialOffersRequest {
  bool include_archived = 1;
}
message ListTrialOffersResponse {
  repeated TrialOffer offers = 1;
}

message CreateTrialOfferRequest {
  TrialOffer offer = 1;
}
message CreateTrialOfferResponse {
  TrialOffer offer = 1;
}

// The offer's terms replaced by `offer`'s, its id naming it: trials to come take them, trials it
// started keep theirs.
message UpdateTrialOfferRequest {
  TrialOffer offer = 1;
}
message UpdateTrialOfferResponse {
  TrialOffer offer = 1;
}

// Archived, an offer is given no more and is no plan's trial.
message ArchiveTrialOfferRequest {
  string id = 1;
}
message ArchiveTrialOfferResponse {
  // The plans it was the trial of, now without one.
  repeated string plan_ids = 1;
}

// The plan's trial set to a catalog offer, or removed when unset.
message SetPlanTrialOfferRequest {
  string plan_id = 1;
  optional string trial_offer_id = 2;
}
message SetPlanTrialOfferResponse {
  optional meteroid.api.plans.v1.PlanTrial trial = 1;
}

service TrialsService {
  rpc ListTrialOffers(ListTrialOffersRequest) returns (ListTrialOffersResponse) {}
  rpc CreateTrialOffer(CreateTrialOfferRequest) returns (CreateTrialOfferResponse) {}
  rpc UpdateTrialOffer(UpdateTrialOfferRequest) returns (UpdateTrialOfferResponse) {}
  rpc ArchiveTrialOffer(ArchiveTrialOfferRequest) returns (ArchiveTrialOfferResponse) {}
  rpc SetPlanTrialOffer(SetPlanTrialOfferRequest) returns (SetPlanTrialOfferResponse) {}
}

// A running trial extended: its end moves later, what follows it with it (R-153).
message ExtendTrialRequest {
  string subscription_id = 1;
  oneof to {
    // The new end, exclusive.
    string until_date = 2;
    uint32 days = 3;
  }
}
message ExtendTrialResponse {
  meteroid.api.subscriptions.v1.TrialConfig trial = 1;
}

// A running trial, or one awaiting a decision, ended today: its end action applies now (a manual
// one converts).
message EndTrialRequest {
  string subscription_id = 1;
}
message EndTrialResponse {
  meteroid.api.subscriptions.v1.TrialConfig trial = 1;
}

message PreviewEndTrialRequest {
  string subscription_id = 1;
}
// What ending the trial today would do, nothing written.
message PreviewEndTrialResponse {
  // CONVERTED, CANCELLED or SWITCHED.
  meteroid.api.subscriptions.v1.TrialConfig.Status outcome = 1;
  string effective_date = 2;
  // The invoice it would issue today; absent when it issues none.
  optional meteroid.api.subscriptions.v1.FirstChargeEstimate invoice = 3;
}

// A subscription's running trial moved. Core.
service SubscriptionTrialsService {
  rpc ExtendTrial(ExtendTrialRequest) returns (ExtendTrialResponse) {}
  rpc EndTrial(EndTrialRequest) returns (EndTrialResponse) {}
  rpc PreviewEndTrial(PreviewEndTrialRequest) returns (PreviewEndTrialResponse) {}
}
