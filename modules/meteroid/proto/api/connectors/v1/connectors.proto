syntax = "proto3";

package meteroid.api.connectors.v1;

import "api/connectors/v1/models.proto";

// Connects any payment provider; `credentials` holds the provider-specific form. The backend
// checks the credentials with the provider before persisting.
message ConnectPaymentProviderRequest {
  oneof credentials {
    StripeConnector stripe = 1;
    GoCardlessConnector gocardless = 2;
    StancerConnector stancer = 3;
    MollieConnector mollie = 4;
  }
  // Providers that can register webhooks themselves (Stripe): if set and no webhook secret is
  // given, the server creates the endpoint at this URL and stores its signing secret. The frontend
  // builds the URL from its public REST base, so it works across deployments without backend
  // config.
  optional string auto_register_webhook_url = 5;
}

message ConnectPaymentProviderResponse {
  Connector connector = 1;
}

message ListConnectorsRequest {
  optional ConnectorTypeEnum connector_type = 1;
}

message ListConnectorsResponse {
  repeated Connector connectors = 1;
}

message DisconnectConnectorRequest {
  string id = 1;
}

message DisconnectConnectorResponse {}

message ConnectHubspotRequest {
  bool auto_sync = 1;
}

message ConnectHubspotResponse {
  string auth_url = 1;
}

message UpdateHubspotConnectorRequest {
  string id = 1;
  bool auto_sync = 2;
}

message UpdateHubspotConnectorResponse {
  Connector connector = 1;
}

message ConnectPennylaneRequest {
  PennylaneConnectorData data = 1;
}

message ConnectPennylaneResponse {
  string auth_url = 1;
}

service ConnectorsService {
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse) {}
  rpc DisconnectConnector(DisconnectConnectorRequest) returns (DisconnectConnectorResponse) {}

  rpc ConnectPaymentProvider(ConnectPaymentProviderRequest) returns (ConnectPaymentProviderResponse) {}
  rpc ConnectHubspot(ConnectHubspotRequest) returns (ConnectHubspotResponse) {}
  rpc UpdateHubspotConnector(UpdateHubspotConnectorRequest) returns (UpdateHubspotConnectorResponse) {}

  rpc ConnectPennylane(ConnectPennylaneRequest) returns (ConnectPennylaneResponse) {}
}
