syntax = "proto3";

package meteroid.api.connectors.v1;

import "api/connectors/v1/models.proto";

// Connects any payment provider; `credentials` holds the provider-specific form. The backend
// checks the credentials with the provider before persisting.
message ConnectPaymentProviderRequest {
  oneof credentials {
    StripeConnector stripe = 1;
    GoCardlessConnector gocardless = 2;
    StancerConnector stancer = 3;
    MollieConnector mollie = 4;
    MockConnector mock = 6;
  }
  // Deprecated and ignored: the server builds the webhook URL from its own configuration.
  optional string auto_register_webhook_url = 5;
}

message ConnectPaymentProviderResponse {
  Connector connector = 1;
}

message ListConnectorsRequest {
  optional ConnectorTypeEnum connector_type = 1;
}

message ListConnectorsResponse {
  repeated Connector connectors = 1;
}

// Deprecated: same as DeleteConnector.
message DisconnectConnectorRequest {
  string id = 1;
}

message DisconnectConnectorResponse {}

// First step of the connect wizard: reserves the alias and the webhook URL.
message CreatePaymentProviderDraftRequest {
  ConnectorProviderEnum provider = 1;
  string alias = 2;
}

message CreatePaymentProviderDraftResponse {
  Connector connector = 1;
}

// Sets or rotates a payment provider's credentials, on a draft or a live connector. Empty secret
// fields keep the stored value. The credentials are checked with the provider and the account
// details are refreshed. Once customers have saved payment methods, the keys must belong to the
// same provider account. The `alias` inside the credentials message is ignored.
message UpdatePaymentProviderCredentialsRequest {
  string id = 1;
  oneof credentials {
    StripeConnector stripe = 2;
    GoCardlessConnector gocardless = 3;
    StancerConnector stancer = 4;
    MollieConnector mollie = 5;
    MockConnector mock = 6;
  }
}

message UpdatePaymentProviderCredentialsResponse {
  Connector connector = 1;
}

message ConnectorIdRequest {
  string id = 1;
}

message ConnectorResponse {
  Connector connector = 1;
}

message DeleteConnectorResponse {}

message RenameConnectorRequest {
  string id = 1;
  string alias = 2;
}

message GetConnectorUsageResponse {
  ConnectorUsage usage = 1;
}

message ConnectHubspotRequest {
  bool auto_sync = 1;
}

message ConnectHubspotResponse {
  string auth_url = 1;
}

message UpdateHubspotConnectorRequest {
  string id = 1;
  bool auto_sync = 2;
}

message UpdateHubspotConnectorResponse {
  Connector connector = 1;
}

message ConnectPennylaneRequest {
  PennylaneConnectorData data = 1;
}

message ConnectPennylaneResponse {
  string auth_url = 1;
}

service ConnectorsService {
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse) {}
  // Deprecated: use DeleteConnector.
  rpc DisconnectConnector(DisconnectConnectorRequest) returns (DisconnectConnectorResponse) {}

  rpc CreatePaymentProviderDraft(CreatePaymentProviderDraftRequest) returns (CreatePaymentProviderDraftResponse) {}
  rpc UpdatePaymentProviderCredentials(UpdatePaymentProviderCredentialsRequest) returns (UpdatePaymentProviderCredentialsResponse) {}
  // DRAFT -> ACTIVE. Requires verified credentials, plus a webhook secret where the provider needs one.
  rpc ActivateConnector(ConnectorIdRequest) returns (ConnectorResponse) {}
  rpc DisableConnector(ConnectorIdRequest) returns (ConnectorResponse) {}
  // Re-checks the credentials with the provider before enabling.
  rpc EnableConnector(ConnectorIdRequest) returns (ConnectorResponse) {}
  // Drafts are removed; other connectors are soft-deleted. Refused while payments are in flight.
  rpc DeleteConnector(ConnectorIdRequest) returns (DeleteConnectorResponse) {}
  // Drafts only: once live, the alias is fixed.
  rpc RenameConnector(RenameConnectorRequest) returns (ConnectorResponse) {}
  // Re-checks the connection with the provider: whether the stored credentials still work (sets or
  // clears `credentials_error`) and the account details, such as enabled payment methods. On a
  // rejected key the error is returned and the connector is flagged.
  rpc CheckConnector(ConnectorIdRequest) returns (ConnectorResponse) {}
  rpc GetConnectorUsage(ConnectorIdRequest) returns (GetConnectorUsageResponse) {}

  rpc ConnectPaymentProvider(ConnectPaymentProviderRequest) returns (ConnectPaymentProviderResponse) {}
  rpc ConnectHubspot(ConnectHubspotRequest) returns (ConnectHubspotResponse) {}
  rpc UpdateHubspotConnector(UpdateHubspotConnectorRequest) returns (UpdateHubspotConnectorResponse) {}

  rpc ConnectPennylane(ConnectPennylaneRequest) returns (ConnectPennylaneResponse) {}
}
