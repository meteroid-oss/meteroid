syntax = "proto3";

package meteroid.api.savedviews.v1;

message SavedView {
  string id = 1;
  string name = 2;
  string metric_key = 3;
  string visualization = 4;
  // JSON-encoded view spec ({ compare, breakdown, cohort, filters, ... }), owned by the client
  string config = 5;
  string created_at = 6;
  optional string updated_at = 7;
  optional string archived_at = 8;
}
