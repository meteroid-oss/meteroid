syntax = "proto3";

package meteroid.api.plans.v1;

enum PlanStatus {
  DRAFT = 0;
  ACTIVE = 1;
  INACTIVE = 2;
  ARCHIVED = 3;
}

enum PlanType {
  STANDARD = 0;
  FREE = 1;
  CUSTOM = 2;
  // template 3 ?
}

message PlanFilters {
  optional string search = 1;
  repeated PlanType types = 2;
  repeated PlanStatus statuses = 3;
  optional string currency = 4;
}

message PlanBillingConfiguration {
  uint32 net_terms = 2;

  oneof service_period_start {
    DayOfMonth day_of_month = 3;
    SubscriptionAnniversary subscription_anniversary = 4;
  }

  message DayOfMonth {
    uint32 day_of_month = 1;
  }

  message SubscriptionAnniversary {}

  oneof billing_cycles {
    Fixed fixed = 6;
    Forever forever = 7;
  }

  message Fixed {
    uint32 count = 1;
  }
  message Forever {}
}

message TrialConfig {
  uint32 duration_days = 1;
  // if true, nothing will be charged during trial. If false, the normal plan price applies.
  bool trial_is_free = 2;
  // what plan's features are applied during the trial (ex: Enterprise for X days). None for current plan's features.
  optional string trialing_plan_id = 3;
}

message PlanVersion {
  string id = 1;
  bool is_draft = 2;
  uint32 version = 3;
  TrialConfig trial_config = 4;
  PlanBillingConfiguration billing_config = 5;
  string currency = 6;
  optional int32 period_start_day = 8;
  int32 net_terms = 9;
  bool uses_product_pricing = 10;
  optional MinimumCommitment minimum_commitment = 11;
  // The version's amounts are quoted tax-included: tax is carved out of them at invoice
  // time instead of being added on top.
  bool tax_inclusive = 12;
  string created_at = 13;
  // What usage does once the credit it draws on runs out. Unset on a draft whose rule was not
  // chosen yet: publishing sets the default (pause when the version grants credit or prices usage
  // in a credit unit, invoice otherwise).
  optional CreditExhaustedRule credit_exhausted_rule = 14;
}

message CreditExhaustedRule {
  enum Kind {
    // Usage beyond the credit is invoiced.
    INVOICE = 0;
    // The access check refuses usage once the credit the subscription can spend is used up.
    PAUSE = 1;
    // Usage beyond the credit is invoiced up to `caps` per billing period, then refused.
    INVOICE_UP_TO = 2;
  }
  Kind kind = 1;
  // INVOICE_UP_TO only, one per denomination the plan charges usage in; usage charged in a
  // denomination without a cap pauses at zero.
  repeated CreditCap caps = 2;
}

message CreditCap {
  // A currency or credit unit code.
  string denomination = 1;
  // Minor units of the denomination.
  int64 amount = 2;
}

// Plan-level period minimum (true-up floor).
// `amount_subunit` is in the currency's minor unit (matches LineItem amounts in invoices).
// At invoice time on a Recurring invoice, the sum of lines (post-discount) for the period
// whose component is included by `scope` is compared to a prorated `amount_subunit`; if
// below, a "Minimum commitment" line tops it up.
message MinimumCommitment {
  int64 amount_subunit = 1;
  Scope scope = 2;

  message Scope {
    oneof kind {
      AllComponents all_components = 1;
      Products products = 2;
    }

    message AllComponents {}
    // Scoped by product: a product is the identity shared by plan components, overrides and
    // ad-hoc extras, so a subscription's actual billed set is matched uniformly.
    message Products {
      repeated string product_ids = 1;
      // Create-time only: local names of ad-hoc *new-product* extras in the same create request
      // whose freshly-minted product ids should be added to the scope. The server resolves these
      // to product ids inside the create transaction (the extra has no id until then). Empty and
      // ignored everywhere else (plan editor, read responses).
      repeated string pending_extra_product_names = 2;
    }
  }
}

message ListPlanVersion {
  string id = 1;
  bool is_draft = 2;
  uint32 version = 3;
  string currency = 6;
  string created_at = 7;
}

message Metadata {
  string key = 1;
  string value = 2;
}

message Plan {
  string id = 1;
  string name = 2;
  string local_id = 3;
  optional string description = 4;
  PlanType plan_type = 5;
  PlanStatus plan_status = 6;
  //  string currency = 7;
  //  PlanVersion version = 8;
  optional string active_version_id = 11;
  optional string draft_version_id = 12;
  optional int32 self_service_rank = 13;
  // Subscriptions to this plan are issued a software license automatically.
  bool issues_license = 14;
}

message PlanOverview {
  string id = 1;
  string name = 2;
  string local_id = 3;
  optional string description = 4;
  PlanType plan_type = 5;
  PlanStatus plan_status = 6;
  string created_at = 7;
  ActiveVersionInfo active_version = 8; // TODO rename to "default" ?
  bool has_draft_version = 9;
  uint32 subscription_count = 10;

  string product_family_local_id = 11;
  string product_family_name = 12;
  optional int32 self_service_rank = 13;
  bool issues_license = 14;

  message ActiveVersionInfo {
    string id = 1;
    uint32 version = 2;
    optional uint32 trial_duration_days = 3;
  }
}

message PlanWithVersion {
  Plan plan = 1;
  PlanVersion version = 2;
}


message PlanParameter {
  oneof param {
    BillingPeriodTerm billing_period_term = 1;
    CapacityThresholdValue capacity_threshold_value = 2;
    CommittedSlot committed_slot = 3;
  }

  message BillingPeriodTerm {}
  message CapacityThresholdValue {
    string component_id = 1;
    repeated uint64 capacity_values = 2;
  }
  message CommittedSlot {
    string component_id = 1;
  }
}


