syntax = "proto3";

package meteroid.api.selfserve.v1;

// How customers move through a product family's self-serve offers.
message ProductFamilyJourney {
  string product_family_id = 1;
  // The plan a customer created with `subscribe_to_signup_plan` starts on, in the customer's
  // currency; unset: none.
  optional string signup_plan_id = 2;
  reserved 3, 6, 7;
  reserved "signup_variant_code", "signup_price_book_code", "signup_term";
  // Customers switch between the options their plan is sold in, in their currency.
  bool period_switch = 4;
  // Customers schedule a downgrade themselves; else the portal sends them to the account team.
  bool self_serve_downgrade = 5;
  // The alias of the sign-up plan's option a sign-up starts on; unset: its default option.
  optional string signup_option = 8;
}

message GetProductFamilyJourneyRequest {
  string product_family_id = 1;
}

message GetProductFamilyJourneyResponse {
  ProductFamilyJourney journey = 1;
}

message SaveProductFamilyJourneyRequest {
  ProductFamilyJourney journey = 1;
}

message SaveProductFamilyJourneyResponse {
  ProductFamilyJourney journey = 1;
}

message PreviewSignupPlanBackfillRequest {
  string product_family_id = 1;
  // Also start customers whose subscription in the product family ended.
  bool include_churned = 2;
}

// How many customers with no plan in the product family a backfill starts on its free sign-up
// plan, and how many it leaves off.
message PreviewSignupPlanBackfillResponse {
  string plan_name = 1;
  uint32 customers = 2;
  // Their subscription in the product family ended: in `customers` only with `include_churned`.
  uint32 churned = 3;
  // They pay in a currency the plan is not sold in.
  uint32 not_sold = 4;
  // The plan has an eligibility rule: `customers` counts those it leaves off too, skipped as
  // the backfill runs.
  bool eligibility_rule = 5;
  // A backfill of the family still running, if any.
  optional string running_batch_job_id = 6;
  // Left off: their start in the family is unfinished, a subscription pending its activation or
  // a trial's checkout, none active.
  uint32 unfinished = 7;
}

message StartSignupPlanBackfillRequest {
  string product_family_id = 1;
  bool include_churned = 2;
}

message StartSignupPlanBackfillResponse {
  string batch_job_id = 1;
  // The customers it starts on the plan.
  uint32 customers = 2;
}

// The self-serve journey of each product family. Needs the customer portal's self-service.
service SelfServeJourneyService {
  rpc GetProductFamilyJourney(GetProductFamilyJourneyRequest) returns (GetProductFamilyJourneyResponse) {}
  rpc SaveProductFamilyJourney(SaveProductFamilyJourneyRequest) returns (SaveProductFamilyJourneyResponse) {}
  // Customers without a plan, started on the free sign-up plan with no email sent: who it starts.
  rpc PreviewSignupPlanBackfill(PreviewSignupPlanBackfillRequest) returns (PreviewSignupPlanBackfillResponse) {}
  // Starts them, as a batch job, with no email sent.
  rpc StartSignupPlanBackfill(StartSignupPlanBackfillRequest) returns (StartSignupPlanBackfillResponse) {}
}
