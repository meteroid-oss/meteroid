syntax = "proto3";

package meteroid.api.prices.v1;

import "api/shared/v1/shared.proto";

enum FeeType {
  RATE = 0;
  SLOT = 1;
  CAPACITY = 2;
  USAGE = 3;
  EXTRA_RECURRING = 4;
  ONE_TIME = 5;
  // A credit pack: a fixed charge that funds the customer's invoice credit when it is paid.
  CREDIT = 6;
}

message Price {
  string id = 1;
  string product_id = 2;
  meteroid.api.shared.v1.BillingPeriod cadence = 3;
  string currency = 4;
  oneof pricing {
    RatePricing rate_pricing = 5;
    SlotPricing slot_pricing = 6;
    CapacityPricing capacity_pricing = 7;
    UsagePricing usage_pricing = 8;
    ExtraRecurringPricing extra_recurring_pricing = 9;
    OneTimePricing one_time_pricing = 10;
    CreditPricing credit_pricing = 13;
  }
  optional string created_at = 11;
  optional string archived_at = 12;
  // Usage (or capacity overage) priced in a credit unit: `pricing` amounts are credits.
  optional PriceCreditUnit credit_unit = 14;
}

message PriceCreditUnit {
  string credit_unit_id = 1;
  // Price-currency major units per credit (decimal), billed on usage the wallet does not cover.
  string rate = 2;
}

message RatePricing {
  string rate = 1;
}

message SlotPricing {
  string unit_rate = 1;
  optional uint32 min_slots = 2;
  optional uint32 max_slots = 3;
}

message CapacityPricing {
  string rate = 1;
  uint64 included = 2;
  string overage_rate = 3;
}

message UsagePricing {
  oneof model {
    string per_unit = 1;
    TieredAndVolumePricing tiered = 2;
    TieredAndVolumePricing volume = 3;
    PackagePricing package = 4;
    MatrixPricing matrix = 5;
  }

  message TieredAndVolumePricing {
    repeated TierRow rows = 1;
    optional uint64 block_size = 2;

    message TierRow {
      uint64 first_unit = 1;
      string unit_price = 2;
      optional string flat_fee = 3;
      optional string flat_cap = 4;
    }
  }

  message PackagePricing {
    string package_price = 1;
    uint64 block_size = 2;
  }

  message MatrixPricing {
    repeated MatrixRow rows = 1;

    message MatrixRow {
      string per_unit_price = 1;
      MatrixDimension dimension1 = 2;
      optional MatrixDimension dimension2 = 3;
    }

    message MatrixDimension {
      string key = 1;
      string value = 2;
    }
  }
}

message ExtraRecurringPricing {
  string unit_price = 1;
  uint32 quantity = 2;
}

message OneTimePricing {
  string unit_price = 1;
  uint32 quantity = 2;
}

// A credit pack priced like a fixed fee: the charge is unit_price × quantity and the invoice credit
// granted is credit_amount × quantity, in the price currency.
message CreditPricing {
  string unit_price = 1;
  uint32 quantity = 2;
  string credit_amount = 3;
  optional CreditPackExpiry expiry = 4;
  // Included packs only (unit_price 0) that expire: unspent credit carried once into a new grant.
  optional CreditPackRollover rollover = 5;
  // The credit unit `credit_amount` is granted in; unset grants the price currency. The pack is
  // always paid in the price currency, and taxed when sold if it grants a unit.
  optional string credit_unit_id = 6;
  // Granted once, on the subscription's first invoice, instead of every period. Never rolls over.
  bool once = 7;
}

message CreditPackRollover {
  // Cap per pack, in the pack's credit (decimal, major units); unset carries all that is left.
  optional string max_amount = 1;
  // Term of the rolled credit from the original expiry: DAY or MONTH only.
  CreditPackExpiry expiry = 2;
}

message CreditPackExpiry {
  enum Unit {
    UNIT_UNSPECIFIED = 0;
    UNIT_DAY = 1;
    UNIT_MONTH = 2;
    UNIT_BILLING_PERIOD = 3;
  }
  Unit unit = 1;
  // Positive duration for DAY and MONTH; ignored for BILLING_PERIOD.
  uint32 value = 2;
}

message FeeStructure {
  oneof structure {
    RateStructure rate = 1;
    SlotStructure slot = 2;
    CapacityStructure capacity = 3;
    UsageStructure usage = 4;
    ExtraRecurringStructure extra_recurring = 5;
    OneTimeStructure one_time = 6;
    CreditStructure credit = 7;
  }

  message RateStructure {}

  message SlotStructure {
    string unit_name = 1;
    reserved 2, 3;
    UpgradePolicy upgrade_policy = 4;
    DowngradePolicy downgrade_policy = 5;
  }

  enum UpgradePolicy {
    PRORATED = 0;
  }

  enum DowngradePolicy {
    REMOVE_AT_END_OF_PERIOD = 0;
  }

  message CapacityStructure {
    string metric_id = 1;
  }

  message UsageStructure {
    string metric_id = 1;
    UsageModel model = 2;
  }

  enum UsageModel {
    PER_UNIT = 0;
    TIERED = 1;
    VOLUME = 2;
    PACKAGE = 3;
    MATRIX = 4;
  }

  message ExtraRecurringStructure {
    BillingType billing_type = 1;
  }

  enum BillingType {
    ARREAR = 0;
    ADVANCE = 1;
  }

  message OneTimeStructure {}

  message CreditStructure {}
}
