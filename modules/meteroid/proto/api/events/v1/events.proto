syntax = "proto3";

package meteroid.api.events.v1;

import "google/protobuf/timestamp.proto";

message SearchEventsRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  uint32 limit = 3;
  uint32 offset = 4;

  // Filters
  optional string search = 5;
  repeated string event_codes = 6;
  repeated string customer_ids = 7;

  // Sorting
  SortOrder sort_order = 8;

  // Pre-aggregation property filters (WHERE-only) — restrict to events a metric would count.
  repeated EventPropertyFilter filters = 9;

  enum SortOrder {
    TIMESTAMP_DESC = 0;
    TIMESTAMP_ASC = 1;
    INGESTED_DESC = 2;
    INGESTED_ASC = 3;
  }
}

// The include/exclude form of a metric filter (the four UI operators already collapsed).
message EventPropertyFilter {
  string property = 1;
  FilterOp op = 2;
  repeated string values = 3;
  enum FilterOp {
    IN = 0;
    NOT_IN = 1;
  }
}

message SearchEventsResponse {
  repeated EventSummary events = 1;
}

message EventSummary {
  string id = 1;
  string code = 2;
  // The raw customer identity carried by the event (internal id or external alias).
  string customer_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  google.protobuf.Timestamp ingested_at = 5;
  map<string, string> properties = 6;
  // Resolved internal customer id (empty when the identity couldn't be resolved),
  // for deep-linking to the customer.
  string customer_local_id = 7;
  // Resolved customer display name (empty when unresolved).
  string customer_name = 8;
}

service EventsService {
  rpc SearchEvents(SearchEventsRequest) returns (SearchEventsResponse) {}
}
