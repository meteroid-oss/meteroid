syntax = "proto3";

package meteroid.portal.checkout.v1;

import "api/subscriptions/v1/models.proto";
import "api/customers/v1/models.proto";
import "api/invoices/v1/models.proto";
import "api/connectors/v1/models.proto";
import "api/bankaccounts/v1/models.proto";



message Checkout {
  api.subscriptions.v1.SubscriptionDetails subscription = 1;
  api.customers.v1.Customer customer = 2;
  repeated api.customers.v1.CustomerPaymentMethod payment_methods = 3;
  repeated api.invoices.v1.LineItem invoice_lines = 6;
  uint64 subtotal_amount = 7;
  uint64 tax_amount = 12;
  uint64 discount_amount = 13;
  uint64 coupon_amount = 16;     // Total from applied coupons
  uint64 total_amount = 8;
  uint64 applied_credits = 20;   // Credits from customer balance applied to this invoice
  uint64 amount_due = 21;        // Actual amount to charge (total - applied_credits)
  repeated TaxBreakdownItem tax_breakdown = 14;
  repeated AppliedCoupon applied_coupons = 15;
  optional string logo_url = 10;
  string trade_name = 11;
  optional string card_connection_id = 17;
  optional string direct_debit_connection_id = 18;
  optional api.bankaccounts.v1.BankAccount bank_account = 19;
  // Portal theme/branding from the invoicing entity (inheriting unset values
  // from the tenant default entity), so checkout themes like the portal.
  optional string brand_color = 22;
  // "light" | "dark".
  optional string theme_mode = 23;
  // "Sharp" | "Modern" | "Rounded".
  optional string roundness = 24;
  bool require_billing_information = 25;
}

message TaxBreakdownItem {
  string name = 1;
  string rate = 2; // Decimal as string
  uint64 amount = 3;
}

message AppliedCoupon {
  string coupon_code = 1;
  string coupon_name = 2;
  uint64 amount = 3;
}


message SlotUpgradeCheckout {
  api.subscriptions.v1.SubscriptionDetails subscription = 1;
  api.customers.v1.Customer customer = 2;
  repeated api.customers.v1.CustomerPaymentMethod payment_methods = 3;

  string price_component_id = 4;
  string unit_name = 5;
  uint32 current_slot_count = 6;
  uint32 new_slot_count = 7;
  int32 delta = 8;

  uint64 prorated_amount = 9;
  string currency = 10;
  optional string logo_url = 11;
  string trade_name = 12;
  // Portal theme/branding from the invoicing entity (inheriting unset values
  // from the tenant default entity), so the upgrade page themes like the portal.
  optional string brand_color = 13;
  // "light" | "dark".
  optional string theme_mode = 14;
  // "Sharp" | "Modern" | "Rounded".
  optional string roundness = 15;
}
