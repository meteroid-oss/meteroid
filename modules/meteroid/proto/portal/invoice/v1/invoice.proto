syntax = "proto3";

package meteroid.portal.invoice.v1;

import "portal/invoice/v1/models.proto";
import "api/invoices/v1/models.proto";

message GetInvoiceForPaymentRequest {
  optional string invoice_id = 1;
}

message GetInvoiceForPaymentResponse {
  InvoiceForPayment invoice = 1;
}

message ConfirmInvoicePaymentRequest {
  string payment_method_id = 1;
  uint64 displayed_amount = 2;
  string displayed_currency = 3;
  optional string invoice_id = 4;
}

message ConfirmInvoicePaymentResponse {
  api.invoices.v1.Transaction transaction = 1;
  // Present when the customer must complete 3DS/SCA before the payment settles.
  optional api.invoices.v1.PaymentActionRequired next_action = 2;
}

// Explicit PAY action for hosted-redirect in-flow-capture providers (Stancer):
// pre-creates the Pending invoice transaction, mints the capturing intent and
// returns the redirect. Click-only — SetupIntent (page render) is side-effect-free.
message InitiateHostedInvoicePaymentRequest {
  // The card customer connection to run the hosted payment on.
  string connection_id = 1;
  // Client-displayed total, validated against the invoice's amount_due.
  uint64 displayed_amount = 2;
  string displayed_currency = 3;
  // Required with CustomerPortal tokens; InvoicePortal tokens carry the invoice.
  optional string invoice_id = 4;
  // Customer's desired post-flow page (same-origin; reflected into the return URL).
  optional string return_url = 5;
}

message InitiateHostedInvoicePaymentResponse {
  // Redirect the customer to the provider-hosted payment page.
  api.invoices.v1.PaymentActionRequired next_action = 1;
}

service PortalInvoiceService {
  rpc GetInvoicePayment(GetInvoiceForPaymentRequest) returns (GetInvoiceForPaymentResponse) {}
  rpc ConfirmInvoicePayment(ConfirmInvoicePaymentRequest) returns (ConfirmInvoicePaymentResponse) {}
  rpc InitiateHostedInvoicePayment(InitiateHostedInvoicePaymentRequest) returns (InitiateHostedInvoicePaymentResponse) {}
}
