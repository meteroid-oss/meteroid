syntax = "proto3";

package meteroid.portal.quotes.v1;

import "api/quotes/v1/models.proto";
import "api/customers/v1/models.proto";
import "api/invoicingentities/v1/models.proto";
import "api/plans/v1/models.proto";

message QuotePortalDetails {
  api.quotes.v1.Quote quote = 1;
  api.customers.v1.Customer customer = 2;
  api.invoicingentities.v1.InvoicingEntityPublic entity = 4;
  repeated api.quotes.v1.QuoteComponent components = 5;
  repeated QuoteSignature signatures = 6;
  repeated QuoteRecipient recipients = 7;
  optional string logo_url = 8;
  repeated api.quotes.v1.QuoteAddOn add_ons = 9;
  string current_recipient_email = 12;
  string current_recipient_name = 13;
  // Effective minimum-commitment shown on the signed document: the quote-level override
  // when set, otherwise the plan's default floor. Display-only.
  optional meteroid.api.plans.v1.MinimumCommitment minimum_commitment = 14;
  // Whether the customer may enter a purchase order on this quote.
  bool purchase_order_enabled = 15;
  // How the current recipient signs: as the customer, or countersigning for the seller.
  api.quotes.v1.QuoteSignerRole current_signer_role = 16;
  repeated QuoteCountersignerStatus countersigners = 17;
  // The verified code was confirmed and can be used to sign.
  bool code_verified = 18;
  // Shown next to the signature when the quote sets none.
  string default_consent_text = 19;
  // Whether the recipient can write to the seller.
  bool discussion_enabled = 20;
  // The messages shared with the customer.
  repeated api.quotes.v1.QuoteComment comments = 21;
  bool change_requests_enabled = 22;
  bool decline_enabled = 23;
  // The invoicing entity's portal branding, as the customer portal applies it.
  optional string theme_mode = 24;
  optional string roundness = 25;
  bool show_powered_by = 26;
  optional api.quotes.v1.QuoteTotals totals = 27;
  // The quote's PDF, signed once accepted (Enterprise, quote-documents module).
  optional string pdf_url = 28;
  repeated api.quotes.v1.QuoteCouponTerms coupon_terms = 29;
  repeated api.quotes.v1.QuotePriceStep price_schedule = 30;
  reserved 31;
}

message QuoteCountersignerStatus {
  string name = 1;
  optional string title = 2;
  bool has_signed = 3;
  // The countersigner is the person viewing the portal.
  bool is_viewer = 4;
}

message QuoteSignature {
  string id = 1;
  string signed_by_name = 2;
  string signed_by_email = 3;
  optional string signed_by_title = 4;
  string signed_at = 5;
  string signature_method = 6;
  api.quotes.v1.QuoteSignerRole signer_role = 7;
  optional int32 revision = 8;
}

message QuoteRecipient {
  string email = 1;
  string name = 2;
  optional string title = 3;
  bool has_signed = 5;
}
