syntax = "proto3";

package meteroid.portal.customer.v1;

import "portal/customer/v1/models.proto";
import "api/customers/v1/models.proto";
import "api/subscriptions/v1/models.proto";
import "api/invoices/v1/models.proto";
import "common/v1/pagination.proto";

message GetCustomerPortalOverviewRequest {}

message GetCustomerPortalOverviewResponse {
  CustomerPortalOverview overview = 1;
}

message ListInvoicesRequest {
  common.v1.Pagination pagination = 1;
}

message ListInvoicesResponse {
  repeated InvoiceSummary invoices = 1;
  common.v1.PaginationResponse pagination_meta = 2;
}

message ListLicensesRequest {}

message ListLicensesResponse {
  repeated PortalLicense licenses = 1;
  // Where installations activate licenses, for display next to the activation code.
  optional string activation_url = 2;
}

// Reveals the activation code of a license that wasn't activated yet (manage scope).
message GetLicenseActivationCodeRequest {
  string license_id = 1;
}

message GetLicenseActivationCodeResponse {
  string activation_code = 1;
}

message ListUsageLimitsRequest {}

message ListUsageLimitsResponse {
  repeated UsageLimitStatus limits = 1;
}

service PortalCustomerService {
  rpc GetCustomerPortalOverview(GetCustomerPortalOverviewRequest) returns (GetCustomerPortalOverviewResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc ListLicenses(ListLicensesRequest) returns (ListLicensesResponse);
  rpc GetLicenseActivationCode(GetLicenseActivationCodeRequest) returns (GetLicenseActivationCodeResponse);
  // The entitlement limits, from the plan or set for the account, that cap the customer's usage.
  rpc ListUsageLimits(ListUsageLimitsRequest) returns (ListUsageLimitsResponse);
}
