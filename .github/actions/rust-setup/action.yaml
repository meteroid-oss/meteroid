name: 'Rust Setup'
description: 'Setup Rust toolchain with dependencies, caching, and mold linker'

inputs:
  components:
    description: 'Rust components to install (comma-separated)'
    default: ''
  install-deps:
    description: 'Install system dependencies (protoc, clang, etc.)'
    default: 'true'
  sccache:
    description: 'Enable sccache'
    default: 'true'
  mold:
    description: 'Use mold linker'
    default: 'true'
  workspaces:
    description: 'Cargo workspaces whose target directory is cached (rust-cache syntax)'
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang unzip
        wget -q https://github.com/protocolbuffers/protobuf/releases/download/v21.8/protoc-21.8-linux-x86_64.zip
        unzip -q protoc*.zip
        sudo mv bin/protoc /usr/local/bin
        sudo mv include/google /usr/local/include
        rm -rf protoc*.zip bin include readme.txt

    - name: Setup mold linker
      if: inputs.mold == 'true'
      uses: rui314/setup-mold@v1

    - name: Set up Cargo CI config
      if: inputs.mold == 'true'
      shell: bash
      run: |
        mkdir -p .cargo && ln -s ../.cargo-templates/ci.toml $_/config.toml

    # The channel rust-toolchain.toml names, so the build does not switch to another toolchain.
    - name: Read the pinned toolchain
      id: toolchain
      shell: bash
      run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

    - name: Install toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ inputs.components }}

    # The cache key hashes every installed toolchain: the image's own would flip it between images.
    - name: Remove the other toolchains
      shell: bash
      run: |
        rustup toolchain list --quiet | grep -v "^${{ steps.toolchain.outputs.channel }}-" | xargs -r -n1 rustup toolchain uninstall
        rustup toolchain list

    # Saved from main only: PRs can only restore main's caches. The key ends with a hash of the
    # lockfiles, so a dependency change saves a new entry and restores the previous one meanwhile.
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v2-rust
        workspaces: ${{ inputs.workspaces }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Run sccache
      if: inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Use sccache
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
