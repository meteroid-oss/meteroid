name: CI Helm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-helm.yaml"
      - "k8s/**"
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/ci-helm.yaml"
      - "k8s/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and render
        run: |
          for values in k8s/meteroid/ci/*.yaml; do
            echo "::group::$values"
            helm lint --strict k8s/meteroid -f "$values"
            helm template meteroid k8s/meteroid -f "$values" > /dev/null
            echo "::endgroup::"
          done
