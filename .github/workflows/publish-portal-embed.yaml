name: Publish portal-embed

# Publishes @md/portal-embed to npm.
#
# DISABLED by default: every job is gated on the `ENABLE_NPM_PUBLISH` repository
# variable. To enable later:
#   1. Add an `NPM_TOKEN` repo secret (an npm automation token with publish access
#      to the @md scope).
#   2. Set the `ENABLE_NPM_PUBLISH` repo variable to `true`.
# Until then this workflow runs but every job is skipped.

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @md/portal-embed
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      TURBO_TELEMETRY_DISABLED: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: "modules/web/pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install --prefix modules/web
      - name: Typecheck
        run: pnpm --prefix modules/web --filter @md/portal-embed typecheck
      - name: Build
        run: pnpm --prefix modules/web --filter @md/portal-embed build
      - name: Publish to npm
        run: pnpm --prefix modules/web --filter @md/portal-embed publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
