name: Docker Build

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    branches:
      - main
      - triton-main
      - '*docker*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        image_type:
          - name: meteroid-api
            dockerfile: modules/meteroid/api.Dockerfile
          - name: meteroid-scheduler
            dockerfile: modules/meteroid/scheduler.Dockerfile
          - name: metering-api
            dockerfile: modules/metering/Dockerfile
          - name: meteroid-web
            dockerfile: modules/web/web-app/Dockerfile
        include:
          - platform: linux/amd64
            mold_arch: x86_64
            proto_arch: x86_64
            grpc_health_probe_arch: amd64
            prefix: amd64
            runs_on: ubuntu-latest
          - platform: linux/arm64
            mold_arch: aarch64
            proto_arch: aarch_64
            grpc_health_probe_arch: arm64
            prefix: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Cargo CI config
        run: |
          mkdir -p .cargo
          ln -s ../.cargo-templates/ci.toml .cargo/config.toml
      - name: Prepare env
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check Docker Hub credentials
        id: docker-hub
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_HUB_USERNAME" && -n "$DOCKER_HUB_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.docker-hub.outputs.configured == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.image_type.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            MOLD_ARCH=${{ matrix.mold_arch }}
            PROTO_ARCH=${{ matrix.proto_arch }}
            GRPC_HEALTH_PROBE_ARCH=${{ matrix.grpc_health_probe_arch }}
            PROFILE=release
            CI=${{ env.CI }}
          push: true
          # Layer caching via the registry (no 10GB GHA-cache cap), so the
          # cargo-chef `cook` layer stays warm instead of being evicted and
          # forcing a ~12min dependency rebuild. Only deployment branches write
          # the cache; other branches restore it read-only and can't evict it.
          cache-from: type=registry,ref=ghcr.io/meteroid-oss/${{ matrix.image_type.name }}:buildcache
          cache-to: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/triton-main') && format('type=registry,ref={0}/{1}:buildcache,mode=max,image-manifest=true,ignore-error=true', env.IMAGE_PREFIX, matrix.image_type.name) || '' }}
          # https://github.com/docker/build-push-action/issues/900
          provenance: false
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image_type.name }},push-by-digest=true,name-canonical=true,push=true,store=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image_type.name }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image_type.name }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image_type.name }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/${{ matrix.image_type.name }}/*
          retention-days: 1

  manifest:
    needs: build
    strategy:
      matrix:
        image_type:
          - meteroid-api
          - meteroid-scheduler
          - metering-api
          - meteroid-web
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image_type }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare registry
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meteroid-docker
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image_type }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=sha-${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=("-t" "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          images=()
          for digest in *; do
            images+=("${IMAGE_PREFIX}/${{ matrix.image_type }}@sha256:${digest}")
          done

          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Push tip tag
        if: github.ref == 'refs/heads/main'
        working-directory: /tmp/digests
        run: |
          images=()
          for digest in *; do
            images+=("${IMAGE_PREFIX}/${{ matrix.image_type }}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}/${{ matrix.image_type }}:tip" \
            "${images[@]}"
