name: meteroid-local-ent-oss

volumes:
  pg_data:
  clickhouse_data:
  minio_data:
  redpanda_data:
  credit_control_redis_data:

networks:
  meteroid_net:

services:

  # The database is all you need to start Meteroid in degraded mode for development.
  meteroid-db:
    extends:
      file: docker-compose.yml
      service: meteroid-db

  # All other services are disabled by default
  # and can be enabled using profiles ex: --profile full

  pgbouncer:
    extends:
      file: docker-compose.yml
      service: pgbouncer
    profiles:
      - webhook
      - full

  minio:
    extends:
      file: docker-compose.yml
      service: minio
    profiles:
      - storage
      - full

  createbuckets:
    extends:
      file: docker-compose.yml
      service: createbuckets
    profiles:
      - storage
      - full

  clickhouse:
    extends:
      file: docker-compose.yml
      service: clickhouse
    profiles:
      - metering
      - full

  redpanda:
    extends:
      file: docker-compose.yml
      service: redpanda
    profiles:
      - metering
      - full

  redpanda-console:
    extends:
      file: docker-compose.yml
      service: redpanda-console
    profiles:
      - metering
      - full

  redpanda-topic-create:
    extends:
      file: docker-compose.yml
      service: redpanda-topic-create
    profiles:
      - metering
      - full

  pghero:
    extends:
      file: docker-compose.yml
      service: pghero
    profiles:
      - pghero

  # Dedicated bounded credit-control Redis — separate from the general cache Redis (6379).
  # Bounded state is the source of truth in Redis, so it needs noeviction + AOF; a single local
  # node has no replica, so run with CREDIT_CONTROL_BOUNDED_MIN_REPLICAS=0 (set in .env).
  # Start with: docker compose -f docker/develop/docker-compose-lite.local.yml --profile credit-control up
  credit-control-redis:
    image: redis:8-alpine
    ports:
      - '6380:6379'
    volumes:
      - credit_control_redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meteroid_net
    profiles:
      - credit-control
      - full



