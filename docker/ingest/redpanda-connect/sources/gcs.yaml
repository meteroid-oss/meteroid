# NDJSON files under an inbox prefix, deleted once ingested; run on a schedule.
input:
  gcp_cloud_storage:
    bucket: ${GCS_BUCKET}
    prefix: ${GCS_PREFIX:meteroid-inbox/}
    scanner:
      lines: {}
    delete_objects: true
pipeline:
  processors:
    - mapping: |
        meta meteroid_event_id = "%s:%s".format(@gcs_key, content().hash("xxhash64").encode("hex"))
    - resource: meteroid_event
output:
  resource: meteroid
