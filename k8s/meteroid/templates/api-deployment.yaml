apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meteroid.apiFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meteroid.apiLabels" . | nindent 4 }}
  {{- with .Values.meteroid.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
{{- end }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: {{ .Values.meteroid.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels:
      {{- include "meteroid.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.meteroid.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "meteroid.apiSelectorLabels" . | nindent 8 }}
        {{- with .Values.meteroid.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "meteroid.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.meteroid.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: {{ .Chart.Name }}-api
          image: {{ include "meteroid.image" (dict "root" . "component" "api" "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.ports.http }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.api.service.ports.grpc }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.meteroid.containerSecurityContext | nindent 12 }}
          env:
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with include "meteroid.licenseEnv" (dict "root" . "licenseServer" true) | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.api.config.pgPoolMaxSize }}
            - name: PG_POOL_MAX_SIZE
              value: {{ . | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: jwt-private-key
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: internal-api-secret
            - name: SECRETS_CRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: secrets-crypt-key
            - name: METEROID_REST_API_EXTERNAL_URL
              value: {{ .Values.global.publicRestApiUrl }}
            - name: METERING_API_EXTERNAL_URL
              value: http://{{ include "meteroid.metering.internalGrpcUrl" . }}
            - name: METEROID_PUBLIC_URL
              value: {{ .Values.global.publicAppUrl }}
            {{- include "meteroid.settingsEnv" . | nindent 12 }}
            {{- range $key, $value := .Values.api.config.rateLimits }}
            - name: RATE_LIMIT_{{ $key | snakecase | upper }}
              value: {{ $value | quote }}
            {{- end }}
            - name: METEROID_API_LISTEN_ADDRESS
              value: 0.0.0.0:{{ .Values.api.service.ports.grpc }}
            - name: METEROID_REST_API_LISTEN_ADDRESS
              value: 0.0.0.0:{{ .Values.api.service.ports.http }}
            {{- with .Values.api.config.enableMultiOrganization }}
            - name: ENABLE_MULTI_ORGANIZATION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.global.adminOrganizationId }}
            - name: ADMIN_ORGANIZATION_ID
              value: {{ . }}
            {{- end }}
            - name: TELEMETRY_TRACING_ENABLED
              value: {{ .Values.global.telemetryTracingEnabled | default "false" | quote }}
            - name: TELEMETRY_METRICS_ENABLED
              value: {{ .Values.global.telemetryMetricsEnabled | default "false" | quote }}
            - name: TELEMETRY_OTEL_ENDPOINT
              value: {{ .Values.global.telemetryOtelEndpoint | default "" | quote }}
            - name: METEROID_DEPLOYMENT
              value: "helm"
            - name: METEROID_TELEMETRY
              value: {{ ternary "on" "off" (ne .Values.global.usageTelemetry false) | quote }}
            - name: OAUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: oauth-google-client-id
                  optional: true
            - name: OAUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: oauth-google-client-secret
                  optional: true
            - name: OAUTH_PENNYLANE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: oauth-pennylane-client-id
                  optional: true
            - name: OAUTH_PENNYLANE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: oauth-pennylane-client-secret
                  optional: true
            - name: OAUTH_HUBSPOT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: oauth-hubspot-client-id
                  optional: true
            - name: OAUTH_HUBSPOT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: oauth-hubspot-client-secret
                  optional: true
            {{- if .Values.global.domainsWhitelist }}
            - name: DOMAINS_WHITELIST
              value: {{ .Values.global.domainsWhitelist }}
            {{- end }}
            {{- if and .Values.global.smtp .Values.global.smtp.host }}
            - name: MAILER_SMTP_HOST
              value: {{ .Values.global.smtp.host }}
            {{- end }}
            {{- if and .Values.global.smtp .Values.global.smtp.host (not .Values.global.smtp.from) }}
            {{- fail "global.smtp.from is required when global.smtp.host is set" }}
            {{- end }}
            {{- if and .Values.global.smtp .Values.global.smtp.from }}
            - name: MAILER_FROM
              value: {{ .Values.global.smtp.from | quote }}
            {{- end }}
            {{- if and .Values.global.smtp .Values.global.smtp.customerFromAddr }}
            - name: MAILER_CUSTOMER_FROM_ADDR
              value: {{ .Values.global.smtp.customerFromAddr | quote }}
            {{- end }}
            {{- if and .Values.global.smtp .Values.global.smtp.replyTo }}
            - name: MAILER_REPLY_TO
              value: {{ .Values.global.smtp.replyTo | quote }}
            {{- end }}
            {{- if and .Values.global.smtp (hasKey .Values.global.smtp "tls") }}
            - name: MAILER_SMTP_TLS
              value: {{ .Values.global.smtp.tls | quote }}
            {{- end }}
            - name: MAILER_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: smtp-username
                  optional: true
            - name: MAILER_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: smtp-password
                  optional: true
            - name: OBJECT_STORE_URI
              value: {{ required "global.objectStore.uri is required" .Values.global.objectStore.uri }}
            {{- if and .Values.global.objectStore .Values.global.objectStore.s3Endpoint }}
            - name: AWS_ENDPOINT
              value: {{ .Values.global.objectStore.s3Endpoint }}
            {{- end }}    
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: aws-access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: aws-secret-access-key
                  optional: true
            {{- if and .Values.global.redis .Values.global.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.global.redis.url }}
            {{- end }}
            {{- if and .Values.global.redis .Values.global.redis.url }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "meteroid.secretsName" . }}
                  key: redis-password
                  optional: true
            {{- end }}
          # Migrations run at start: a kill mid-migration rolls it back and starts it over.
          startupProbe:
            httpGet:
              path: {{ dig "httpStartupProbe" "path" "/health" .Values.api }}
              port: http
            initialDelaySeconds: {{ dig "httpStartupProbe" "initialDelaySeconds" 5 .Values.api }}
            periodSeconds: {{ dig "httpStartupProbe" "periodSeconds" 5 .Values.api }}
            failureThreshold: {{ dig "httpStartupProbe" "failureThreshold" 360 .Values.api }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ dig "httpLivenessProbe" "periodSeconds" 20 .Values.api }}
          readinessProbe:
            httpGet:
              path: {{ dig "httpReadinessProbe" "path" "/health" .Values.api }}
              port: http
            periodSeconds: {{ dig "httpReadinessProbe" "periodSeconds" 10 .Values.api }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- tpl . $ | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
