apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meteroid.webFullname" . }}
  labels:
    {{- include "meteroid.webLabels" . | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "meteroid.webSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meteroid.webSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}-web
          image: {{ include "meteroid.image" (dict "root" . "component" "web" "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: VITE_METEROID_API_EXTERNAL_URL
              value: {{ .Values.global.publicApiUrl }}
            - name: VITE_METEROID_REST_API_EXTERNAL_URL
              value: {{ .Values.global.publicRestApiUrl }}
            {{- with dig "config" "openReplay" "projectKey" "" .Values.web }}
            - name: VITE_PUBLIC_OPENREPLAY_PROJECT_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- with dig "config" "openReplay" "ingestPoint" "" .Values.web }}
            - name: VITE_PUBLIC_OPENREPLAY_INGEST_POINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
