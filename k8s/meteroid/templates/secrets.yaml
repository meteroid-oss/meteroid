{{- if not .Values.global.secrets.existingSecretName }}
{{- $s := .Values.global.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meteroid.secretsName" . }}
  labels:
    {{- include "meteroid.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "A valid global.secrets.databaseUrl is required" .Values.global.secrets.databaseUrl }}
  jwt-private-key: {{ required "A valid global.secrets.jwtPrivateKey is required" .Values.global.secrets.jwtPrivateKey }}
  internal-api-secret: {{ required "A valid global.secrets.internalApiSecret is required" .Values.global.secrets.internalApiSecret }}
  secrets-crypt-key: {{ required "A valid global.secrets.secretsCryptkey is required" .Values.global.secrets.secretsCryptkey }}
  {{- with dig "licenseKey" "" $s }}
  license-key: {{ . | quote }}
  {{- end }}
  {{- with dig "oauthGoogle" "clientId" "" $s }}
  oauth-google-client-id: {{ . | quote }}
  {{- end }}
  {{- with dig "oauthGoogle" "clientSecret" "" $s }}
  oauth-google-client-secret: {{ . | quote }}
  {{- end }}
  {{- with dig "oauthPennylane" "clientId" "" $s }}
  oauth-pennylane-client-id: {{ . | quote }}
  {{- end }}
  {{- with dig "oauthPennylane" "clientSecret" "" $s }}
  oauth-pennylane-client-secret: {{ . | quote }}
  {{- end }}
  {{- with dig "oauthHubspot" "clientId" "" $s }}
  oauth-hubspot-client-id: {{ . | quote }}
  {{- end }}
  {{- with dig "oauthHubspot" "clientSecret" "" $s }}
  oauth-hubspot-client-secret: {{ . | quote }}
  {{- end }}
  {{- with dig "kafka" "password" "" $s }}
  kafka-password: {{ . | quote }}
  {{- end }}
  {{- with dig "redis" "password" "" $s }}
  redis-password: {{ . | quote }}
  {{- end }}
  {{- with dig "clickhouse" "password" "" $s }}
  clickhouse-password: {{ . | quote }}
  {{- end }}
  {{- with dig "smtp" "username" "" $s }}
  smtp-username: {{ . | quote }}
  {{- end }}
  {{- with dig "smtp" "password" "" $s }}
  smtp-password: {{ . | quote }}
  {{- end }}
  {{- with dig "objectStore" "accessKeyId" "" $s }}
  aws-access-key-id: {{ . | quote }}
  {{- end }}
  {{- with dig "objectStore" "secretAccessKey" "" $s }}
  aws-secret-access-key: {{ . | quote }}
  {{- end }}
{{- end }}
