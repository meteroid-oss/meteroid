global:
  objectStore:
    uri: s3://meteroid
  secrets:
    existingSecretName: meteroid-secrets
  kafka:
    bootstrapServers: kafka:9092
  clickhouse:
    address: tcp://clickhouse:9000
    httpAddress: http://clickhouse:8123
    tcpAddress: clickhouse:9000
api:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
