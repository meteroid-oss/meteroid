commonSettings: &commonSettings
  replicaCount: 1
  # CPU-based autoscaling needs resources.requests.cpu
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  image:
    pullPolicy: IfNotPresent
  podAnnotations: {}
  podLabels: {}
  tolerations: []
  nodeSelector: {}
  affinity: {}
  extraEnv: []
  resources: {}
  terminationGracePeriodSeconds: 30

meteroid:
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

serviceAccount:
  create: true
  name: null
  imagePullSecrets: []
  annotations: {}
  automountServiceAccountToken: true

global:
  publicAppUrl: "https://app.example.com"
  publicApiUrl: "https://rpc.example.com"
  publicRestApiUrl: "https://api.example.com"

  telemetryTracingEnabled: false
  telemetryMetricsEnabled: false
  telemetryOtelEndpoint: ""

  # Anonymous daily usage report sent to Meteroid, see docs.meteroid.com/self-hosting/telemetry.
  usageTelemetry: true

  smtp:
    # host: ""
    # Sender of account and alert emails; required once host is set
    # from: "Billing <billing@example.com>"
    # Address customer emails are sent from, behind each invoicing entity's sender name; defaults to the address of `from`
    # customerFromAddr: "billing@example.com"
    # Reply-To of account and alert emails; none by default
    # replyTo: "No Reply <no-reply@example.com>"
    # tls: true

  # S3-compatible bucket, e.g. s3://meteroid
  objectStore:
    uri: ""
    # s3Endpoint: ""

  secrets:
    # if using an external secret use this
    existingSecretName: ""

    # # else provide below; only the first four are required
    # databaseUrl: ""
    # jwtPrivateKey: ""
    # internalApiSecret: ""
    # secretsCryptkey: ""  # exactly 32 ASCII characters, e.g. `openssl rand -hex 16`; never change it
    # kafka:
    #   password: ""
    # clickhouse:
    #   password: ""
    # redis:
    #   password: ""
    # oauthGoogle:
    #   clientId: ""
    #   clientSecret: ""
    # objectStore:
    #   accessKeyId: ""
    #   secretAccessKey: ""
    # smtp:
    #   username: ""
    #   password: ""

  # Postgres comes from the database-url secret; Kafka and ClickHouse are configured below
  kafka:
    bootstrapServers: ""
    securityProtocol: SASL_PLAINTEXT
    saslMechanism: SCRAM-SHA-512
    saslUsername: meteroid

  clickhouse:
    address: ""
    httpAddress: ""
    tcpAddress: ""
    database: "meteroid"
    username: "meteroid"
    clusterName: "meteroid"

  # Optional: without it, rate limits and caches are kept per replica
  redis:
    url: ""

  # Issuer shown in authenticator apps
  mfaIssuer: "Meteroid"

  # Outbound webhooks and alert channels; unset keys keep the app defaults
  webhooks:
    # CONNECT proxy for webhook and alert deliveries (e.g. Smokescreen)
    egressProxyUrl: ""
    # deliveryConcurrency: 32
    # retentionDays: 30
    # Enterprise images only (the OSS ones do not restrict destinations):
    # allowPrivateDestinations: false
    # SSO overrides, defaulting to the settings above:
    # ssoAllowPrivateDestinations: false
    # ssoUseProxy: false

ingress:
  enabled: true
  # Traefik IngressRoute, or a standard Ingress when false
  useIngressRoute: true
  className: traefik
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
          port: 80
    - host: rpc.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
          port: 50061
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
          port: 8080
  tls:
    - hosts:
        - app.example.com
        - rpc.example.com
        - api.example.com
      secretName: meteroid-tls

api:
  <<: *commonSettings
  image:
    repository: ghcr.io/meteroid-oss/meteroid-api
    # Defaults to the chart's appVersion
    tag: ""
  service:
    type: ClusterIP
    ports:
      http: 8080
      grpc: 50061
  config:
    # Connections per pod; keep replicas x pool under Postgres' max_connections
    pgPoolMaxSize: 5

# Web Configuration
web:
  <<: *commonSettings
  image:
    repository: ghcr.io/meteroid-oss/meteroid-web
    # Defaults to the chart's appVersion
    tag: ""
  service:
    type: ClusterIP
    ports:
      - port: 80
        targetPort: http
        protocol: TCP
        name: http

# Metering Configuration
metering:
  <<: *commonSettings
  enabled: true
  image:
    repository: ghcr.io/meteroid-oss/metering-api
    # Defaults to the chart's appVersion
    tag: ""
  service:
    type: ClusterIP
    ports:
      http: 8081
      grpc: 50062

# Worker Configuration (scheduled jobs and queue consumers). The former `scheduler` key is
# still read, over this one, until 2.1.
worker:
  <<: *commonSettings
  image:
    repository: ghcr.io/meteroid-oss/meteroid-worker
    # Defaults to the chart's appVersion
    tag: ""
  config:
    pgPoolMaxSize: 15
