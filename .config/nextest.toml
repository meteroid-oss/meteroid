# Money tests never retry: a flaky billing test is a bug and must fail. Only the suites that start
# Kafka/ClickHouse containers retry, for transient container failures. The ci profile inherits
# these overrides.
[profile.default]
retries = 0

# Tests that run for tens of seconds start first, so none of them is the last one running.
# A test that takes more than ~20 s in CI belongs here. The ClickHouse and Kafka tests are left
# out: started all at once they crowd the runner, and spread over the run they take ~10-20 s.
[[profile.default.overrides]]
filter = '''
    test(/^model::credit_engine_matches_the_reference_model/)
    | test(/^model::invoice_engine_matches_the_reference_model/)
    | test(/^subscription::lock_stress::/)
    | test(/^test_usage_monitors_(stack|e2e)::/)
    | test(/^test_sandbox_(credits|signals)::/)
'''
priority = 50

[[profile.default.overrides]]
filter = "test(/^(e2e|test_metering_|test_usage_attribution|test_usage_costs_metering|test_event_insights|test_usage_monitors_stack|test_usage_attribution_gate)/)"
retries = 2

[profile.ci.junit]
path = "junit.xml"
